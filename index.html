<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F3F1EE;
    --surface:#FFFFFF;
    --surface-2:#EAE6E0;
    --ink:#181512;
    --ink-soft:#4A423C;
    --muted:#867B71;
    --border:#DEDAD2;
    --accent:#E85C0D;
    --accent-strong:#B8460A;
    --accent-soft:#FBE0CC;
    --accent-soft-ink:#B8460A;
    --good:#3E8A5C;
    --good-soft:#DFEEE3;
    --warn:#B8842E;
    --warn-soft:#F6EAD2;
    --bad:#B14B3E;
    --bad-soft:#F5DCD6;
    --blue:#2F6FE0;
    --tier-ouro-bg:#F5E1AC; --tier-ouro-ink:#8A6511;
    --tier-prata-bg:#E4E4E4; --tier-prata-ink:#5B5B5B;
    --tier-bronze-bg:#EAD0B5; --tier-bronze-ink:#8A4E1E;
    --shadow:0 1px 2px rgba(20,15,10,0.07), 0 10px 28px -14px rgba(20,15,10,0.25);
    --radius:12px;
    --sidebar-w:236px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E0C0B;
      --surface:#171412;
      --surface-2:#1F1B18;
      --ink:#F5F1EC;
      --ink-soft:#C9C1B8;
      --muted:#8D8378;
      --border:#2B2622;
      --accent:#FF7A21;
      --accent-strong:#FF9A50;
      --accent-soft:#3A2313;
      --accent-soft-ink:#FF9A50;
      --good:#5FBE85;
      --good-soft:#1E3327;
      --warn:#E0B24C;
      --warn-soft:#392C18;
      --bad:#E2796A;
      --bad-soft:#39231E;
      --blue:#5B93F5;
      --tier-ouro-bg:#4A3B15; --tier-ouro-ink:#F0CC6E;
      --tier-prata-bg:#3A3A3A; --tier-prata-ink:#D6D6D6;
      --tier-bronze-bg:#452D18; --tier-bronze-ink:#E3A96E;
      --shadow:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E0C0B;
    --surface:#171412;
    --surface-2:#1F1B18;
    --ink:#F5F1EC;
    --ink-soft:#C9C1B8;
    --muted:#8D8378;
    --border:#2B2622;
    --accent:#FF7A21;
    --accent-strong:#FF9A50;
    --accent-soft:#3A2313;
    --accent-soft-ink:#FF9A50;
    --good:#5FBE85;
    --good-soft:#1E3327;
    --warn:#E0B24C;
    --warn-soft:#392C18;
    --bad:#E2796A;
    --bad-soft:#39231E;
    --blue:#5B93F5;
    --tier-ouro-bg:#4A3B15; --tier-ouro-ink:#F0CC6E;
    --tier-prata-bg:#3A3A3A; --tier-prata-ink:#D6D6D6;
    --tier-bronze-bg:#452D18; --tier-bronze-ink:#E3A96E;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -14px rgba(0,0,0,0.5);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand-name{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;font-weight:400;}
  .tnum{font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  #app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  #sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    gap:22px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{display:flex;align-items:center;padding:0 6px;}
  .brand-logo{width:100%;max-width:196px;height:auto;display:block;border-radius:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,#1B1815 0%, var(--accent) 100%);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .brand-mark svg{width:18px;height:18px;stroke:#fff;fill:none;}
  .brand-name{font-size:18px;font-weight:400;color:var(--ink);line-height:1;white-space:nowrap;}
  .brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navlink{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:9px;
    color:var(--ink-soft);font-size:13.5px;font-weight:500;
    cursor:pointer;border:none;background:none;text-align:left;width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .navlink svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none;}
  .navlink:hover{background:var(--surface-2);color:var(--ink);}
  .navlink.active{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600;}
  .navlink:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .sidebar-foot{border-top:1px solid var(--border);padding-top:14px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
  .ig-link{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);text-decoration:none;font-weight:600;font-size:12px;transition:color .12s ease;}
  .ig-link:hover{color:var(--accent);}
  .ig-link svg{width:16px;height:16px;stroke:currentColor;fill:none;flex:none;}
  .sync-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;background:var(--surface-2);font-size:11px;font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none;}
  .dot.local{background:var(--warn);}

  /* MAIN */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px 18px;
    border-bottom:1px solid var(--border);
    gap:16px;flex-wrap:wrap;
  }
  #topbar h1{font-size:23px;font-weight:600;margin:0;color:var(--ink);}
  #topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  #topbar-actions{display:flex;gap:10px;align-items:center;}
  #view-root{padding:26px 32px 60px;flex:1;}

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;
    cursor:pointer;transition:filter .12s ease, background .12s ease;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .btn:hover{filter:brightness(0.97);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#181110;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .icon-btn{padding:7px;border-radius:7px;}

  /* KPI GRID */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .kpi-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .kpi-value{font-family:'Inter',sans-serif;font-size:25px;font-weight:800;margin-top:6px;color:var(--ink);letter-spacing:-.01em;}
  .kpi-delta{font-size:12px;margin-top:5px;font-weight:600;}
  .kpi-delta.up{color:var(--good);}
  .kpi-delta.down{color:var(--bad);}
  .kpi-delta.flat{color:var(--muted);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
  @media (max-width:980px){.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .card-head h3{font-size:15.5px;margin:0;font-weight:600;}
  .card-body{padding:16px 18px;}
  .card-body.tight{padding:0;}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th.th-sort{cursor:pointer;user-select:none;}
  th.th-sort:hover{color:var(--ink-soft);}
  th.th-sort .sort-arrow{display:inline-block;width:10px;font-size:9px;letter-spacing:0;opacity:.35;}
  th.th-sort .sort-arrow.active{opacity:1;color:var(--accent);}
  td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--ink-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .cell-strong{color:var(--ink);font-weight:600;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .icon-inline{display:inline-flex;vertical-align:-3px;}
  .icon-inline svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.6;}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .empty svg{width:34px;height:34px;stroke:var(--muted);fill:none;stroke-width:1.4;margin-bottom:10px;}
  .empty p{margin:0 0 12px;font-size:13px;}

  /* BADGES */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge.good{background:var(--good-soft);color:var(--good);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.bad{background:var(--bad-soft);color:var(--bad);}
  .badge.muted{background:var(--surface-2);color:var(--muted);}
  .badge.tier-ouro{background:var(--tier-ouro-bg);color:var(--tier-ouro-ink);}
  .badge.tier-prata{background:var(--tier-prata-bg);color:var(--tier-prata-ink);}
  .badge.tier-bronze{background:var(--tier-bronze-bg);color:var(--tier-bronze-ink);}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:700;font-size:12px;flex:none;}
  .rank-badge.top{background:var(--accent);color:#181110;}

  /* FORM / MODAL */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,26,20,.42);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--surface);border-radius:14px;border:1px solid var(--border);
    width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.35);
  }
  .modal.wide{max-width:740px;}
  .measure-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
  .measure-row .field{margin:0;flex:1 1 120px;min-width:100px;}
  .measure-row .m-value, .measure-row .m-unit{flex:0 1 70px;min-width:60px;}
  .measure-row .m-remove{flex:none;margin-bottom:1px;}

  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0;font-size:16px;font-weight:600;}
  .modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  input,select,textarea{
    font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;
    border:1px solid var(--border);background:var(--bg);color:var(--ink);width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  textarea{resize:vertical;min-height:64px;}

  /* SEARCHABLE SELECT (COMBOBOX) */
  .searchable-select{position:relative;}
  .ss-dropdown{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:150;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    max-height:220px;overflow-y:auto;box-shadow:var(--shadow);
  }
  .ss-option{padding:9px 11px;font-size:13.5px;cursor:pointer;color:var(--ink);}
  .ss-option:hover,.ss-option.active{background:var(--surface-2);}
  .ss-option .ss-sub{color:var(--muted);font-size:11.5px;margin-top:1px;}
  .ss-empty{padding:9px 11px;font-size:13px;color:var(--muted);}

  /* FILTER BAR */
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .filter-bar select,.filter-bar input{width:auto;min-width:140px;}
  .search-input{position:relative;flex:1;min-width:180px;max-width:280px;}
  .search-input svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;}
  .search-input input{padding-left:32px;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--bg);
    padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
    z-index:200;opacity:0;transform:translateY(8px);transition:opacity .18s ease, transform .18s ease;pointer-events:none;
  }
  :root[data-theme="dark"] .toast, @media (prefers-color-scheme:dark){.toast{}}
  .toast.show{opacity:1;transform:translateY(0);}

  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px;}
  .bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .bars .bar{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--accent);position:relative;min-height:3px;}
  .bars .bar.neg{background:var(--bad);}
  .bars .bar.blue{background:var(--blue);}
  .bars .bar.pos{background:var(--good);}
  .bars .bar-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .bars .bar-value{font-size:9.5px;color:var(--muted);}

  .avatar{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-soft-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
  .flex{display:flex;align-items:center;}
  .gap6{gap:6px;}
  .gap8{gap:8px;}
  .gap10{gap:10px;}
  .muted{color:var(--muted);}
  .mt2{margin-top:2px;}

  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px;width:fit-content;}
  .tab{padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  /* AGENDA: WEEK / MONTH VIEWS */
  .agenda-nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0;}
  .agenda-nav h3{margin:0;font-size:15px;font-weight:700;text-transform:capitalize;}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .week-day{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;}
  .week-day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .week-day-head{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
  .week-day-head .num{font-size:15px;color:var(--ink);font-weight:700;}
  .week-appt{font-size:11.5px;padding:5px 7px;border-radius:6px;background:var(--surface-2);cursor:pointer;line-height:1.35;}
  .week-appt .t{font-weight:700;}
  .week-appt.status-concluido{background:var(--good-soft);color:var(--good);}
  .week-appt.status-cancelado,.week-appt.status-faltou{background:var(--bad-soft);color:var(--bad);opacity:.85;}
  .week-empty{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;}

  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .month-dow{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px;}
  .month-day{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px;min-height:74px;display:flex;flex-direction:column;gap:4px;cursor:pointer;}
  .month-day.empty{background:transparent;border-color:transparent;cursor:default;}
  .month-day.is-today{border-color:var(--accent);}
  .month-day.is-selected{box-shadow:0 0 0 2px var(--accent) inset;}
  .month-day .num{font-size:12.5px;font-weight:700;}
  .month-day .dots{display:flex;gap:3px;flex-wrap:wrap;}
  .month-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}
  .month-dot.status-concluido{background:var(--good);}
  .month-dot.status-cancelado,.month-dot.status-faltou{background:var(--bad);}
  .month-day .more{font-size:9.5px;color:var(--muted);}
  @media (max-width:1024px){
    .week-grid{grid-template-columns:repeat(7,minmax(90px,1fr));overflow-x:auto;}
    .month-grid{grid-template-columns:repeat(7,minmax(38px,1fr));}
    .month-day .more{display:none;}
  }

  #menu-toggle{display:none;}
  #sidebar-backdrop{display:none;}

  /* TABLET: keep the sidebar, just tighten spacing */
  @media (max-width:1024px){
    :root{--sidebar-w:200px;}
    #topbar{padding:18px 22px 14px;}
    #view-root{padding:18px 22px 50px;}
    .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
    .navlink span{white-space:nowrap;}
  }

  /* MOBILE: sidebar becomes an off-canvas drawer opened by the menu button */
  @media (max-width:760px){
    :root{--sidebar-w:250px;}
    #sidebar{position:fixed;left:0;top:0;z-index:60;height:100vh;transform:translateX(-100%);transition:transform .18s ease;}
    #sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.25);}
    #sidebar.open ~ #sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(20,26,20,.4);z-index:55;}
    #topbar{padding:14px 16px;flex-wrap:nowrap;}
    #topbar > div:first-child{min-width:0;}
    #view-title{font-size:19px;}
    #view-root{padding:14px 16px 50px;}
    .field-row{grid-template-columns:1fr;}
    #menu-toggle{display:inline-flex !important;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .kpi{padding:13px 14px;}
    .kpi-value{font-size:21px;}
    #topbar-actions .btn span{display:none;}
    #topbar-actions .btn{padding:9px;}
    .card-head{padding:13px 14px;}
    .card-head h3{font-size:14px;}
    th,td{padding:9px 10px;font-size:12.5px;}
    .modal{max-height:92vh;}
  }

  @media (max-width:420px){
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .tabs{overflow-x:auto;max-width:100%;}
  }

  /* PIN de acesso (opcional) */
  #pin-gate{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  #pin-gate[hidden]{display:none;}
  #pin-gate .pin-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;max-width:320px;width:100%;box-shadow:var(--shadow);text-align:center;}
  #pin-gate input{text-align:center;font-size:18px;letter-spacing:.1em;margin-top:14px;}
  #pin-gate .btn{width:100%;justify-content:center;margin-top:12px;}
  #pin-gate p.err{color:var(--bad);font-size:12.5px;margin:8px 0 0;min-height:16px;}

  /* FICHAS DE AVALIAÇÃO ESTRUTURADAS */
  .fc-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-strong);margin:6px 0 -2px;padding-top:10px;border-top:1px dashed var(--border);}
  .fc-section-title:first-of-type{border-top:none;padding-top:0;}
  .fc-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;}
  .fc-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .fc-check input{width:auto;flex:none;}
  .fc-flag span{color:var(--bad);}
  .fc-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:600px){.fc-row-3{grid-template-columns:1fr;}}
  .fc-testrow{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
  .fc-testrow .fc-testname{font-size:12.5px;font-weight:600;color:var(--ink);padding-bottom:9px;}
  .fc-lsi{font-size:11.5px;font-weight:700;padding:6px 0;white-space:nowrap;}
  .fc-lsi-good{color:var(--good);}
  .fc-lsi-warn{color:var(--warn);}
  .fc-lsi-bad{color:var(--bad);}
  .fc-semaphore{display:flex;gap:8px;flex-wrap:wrap;}
  .fc-sem-opt{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;}
  .fc-sem-opt input{width:auto;}
  .fc-sem-verde{color:var(--good);}
  .fc-sem-amarelo{color:var(--warn);}
  .fc-sem-vermelho{color:var(--bad);}
  .fc-sem-opt:has(input:checked).fc-sem-verde{background:var(--good-soft);border-color:var(--good);}
  .fc-sem-opt:has(input:checked).fc-sem-amarelo{background:var(--warn-soft);border-color:var(--warn);}
  .fc-sem-opt:has(input:checked).fc-sem-vermelho{background:var(--bad-soft);border-color:var(--bad);}
</style>
</head>

/* ---------- SEARCHABLE SELECT (COMBOBOX) ---------- */
function normalizeSearch(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function searchableSelectHTML(id, items, selectedId, placeholder){
  const sorted = [...items].sort((a,b)=>a.label.localeCompare(b.label,'pt-BR',{sensitivity:'base'}));
  const sel = sorted.find(i=>i.id===selectedId);
  return `<div class="searchable-select" data-ss-id="${id}">
    <input type="text" class="ss-input" id="${id}-input" autocomplete="off" placeholder="${escapeHtml(placeholder||'Digite para buscar...')}" value="${sel?escapeHtml(sel.label):''}">
    <input type="hidden" id="${id}" value="${selectedId||''}">
    <div class="ss-dropdown" id="${id}-dropdown" hidden></div>
  </div>`;
}
function wireSearchableSelect(root, id, items, onSelect){
  const wrap = root.querySelector(`[data-ss-id="${id}"]`);
  if(!wrap) return;
  const input = wrap.querySelector('.ss-input');
  const hidden = wrap.querySelector(`#${CSS.escape(id)}`);
  const dropdown = wrap.querySelector('.ss-dropdown');
  const sorted = [...items].sort((a,b)=>a.label.localeCompare(b.label,'pt-BR',{sensitivity:'base'}));

  function renderList(query){
    const q = normalizeSearch(query);
    const filtered = q ? sorted.filter(i=>normalizeSearch(i.label).includes(q)) : sorted;
    dropdown.innerHTML = filtered.length===0
      ? `<div class="ss-empty">Nenhum resultado</div>`
      : filtered.map(i=>`<div class="ss-option" data-id="${escapeHtml(i.id)}">${escapeHtml(i.label)}${i.sub?`<div class="ss-sub">${escapeHtml(i.sub)}</div>`:''}</div>`).join('');
    dropdown.hidden = false;
  }

  input.addEventListener('focus', ()=>{ input.select(); renderList(''); });
  input.addEventListener('input', ()=>{ hidden.value=''; renderList(input.value); });
  dropdown.addEventListener('mousedown', e=>{
    const opt = e.target.closest('.ss-option');
    if(!opt) return;
    e.preventDefault();
    const item = sorted.find(i=>i.id===opt.dataset.id);
    if(item){
      hidden.value = item.id;
      input.value = item.label;
      dropdown.hidden = true;
      if(onSelect) onSelect(item);
    }
  });
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{
      dropdown.hidden = true;
      if(!hidden.value){
        const match = sorted.find(i=>normalizeSearch(i.label)===normalizeSearch(input.value));
        if(match){ hidden.value=match.id; input.value=match.label; if(onSelect) onSelect(match); }
        else { input.value=''; }
      }
    }, 150);
  });
}
const fmtCompactMoney = n => { const v=Number(n)||0; const sign=v<0?'-':''; const abs=Math.abs(v); if(abs>=1000) return sign+'R$'+(abs/1000).toFixed(1).replace('.',',')+'k'; return sign+'R$'+abs.toFixed(0); };
const fmtDate = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtDateShort = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}`; };

// ---- Ajuda para períodos em meses ('YYYY-MM') usados no gráfico Financeiro ----
function shiftMonthKey(mk, delta){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function currentMonthKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthRangeKeys(fromMk, toMk){
  // gera a lista de 'YYYY-MM' de fromMk até toMk (inclusive); se fromMk vier depois de toMk, inverte.
  let a=fromMk, b=toMk;
  if(a>b){ const t=a; a=b; b=t; }
  const out=[];
  let cur=a, guard=0;
  while(cur<=b && guard<600){ out.push(cur); cur=shiftMonthKey(cur,1); guard++; }
  return out;
}

/* ---------- EXPORT HELPERS (Excel / PDF) ---------- */
function exportToExcel(filename, sheets){
  if(typeof XLSX==='undefined'){ showToast('Biblioteca de exportação não carregou. Verifique sua conexão e tente novamente.'); return; }
  try{
    const wb = XLSX.utils.book_new();
    Object.entries(sheets).forEach(([name, rows])=>{
      const hasData = rows && rows.length;
      const ws = XLSX.utils.json_to_sheet(hasData ? rows : [{'Sem dados':''}]);
      if(hasData){
        const headers = Object.keys(rows[0]);
        headers.forEach((h, colIdx)=>{
          if(/\(R\$\)\s*$/.test(h)){
            for(let r=0;r<rows.length;r++){
              const cellRef = XLSX.utils.encode_cell({r:r+1, c:colIdx});
              if(ws[cellRef]){ ws[cellRef].t='n'; ws[cellRef].z='"R$" #,##0.00'; }
            }
          }
        });
      }
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
    });
    XLSX.writeFile(wb, filename);
    showToast('Planilha exportada');
  }catch(e){ console.warn('export excel error', e); showToast('Não foi possível exportar a planilha'); }
}
function exportRankingPdf(title, periodLabel, colLabel, valueLabel, rows, isMoney){
  if(typeof window.jspdf==='undefined'){ showToast('Biblioteca de exportação não carregou. Verifique sua conexão e tente novamente.'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Elite Lab Recovery', 14, 16);
    doc.setFontSize(12); doc.text(title, 14, 24);
    doc.setFontSize(10); doc.setTextColor(120); doc.text(periodLabel, 14, 30);
    doc.setTextColor(0);
    const body = rows.map((r,i)=>[String(i+1), r.name, isMoney?fmtMoney(r.value):String(r.value)]);
    doc.autoTable({ startY:36, head:[['#',colLabel,valueLabel]], body, headStyles:{fillColor:[232,92,13]}, styles:{fontSize:9} });
    doc.save((title.toLowerCase().replace(/[^a-z0-9]+/g,'-'))+'.pdf');
    showToast('PDF exportado');
  }catch(e){ console.warn('export pdf error', e); showToast('Não foi possível exportar o PDF'); }
}

function getAbsentClients(days){
  const {clients, appointments} = Store.data;
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-days);
  return clients.filter(c=>(c.status||'ativo')==='ativo').map(c=>{
    const done = appointments.filter(a=>a.clientId===c.id && a.status==='concluido' && a.date).sort((x,y)=>y.date.localeCompare(x.date));
    const last = done[0]?.date || null;
    return {c, last};
  }).filter(x=> x.last ? new Date(x.last+'T00:00:00') < cutoff : true) // sem sessão concluída também conta como ausente
    .filter(x=> x.c.createdAt ? new Date((x.c.createdAt||'').slice(0,10)+'T00:00:00') < cutoff : true) // ignora cadastros muito recentes sem histórico
    .sort((a,b)=> (a.last||'').localeCompare(b.last||''));
}

/* ---------- STORE ---------- */
const Store = {
  mode:'connecting', // 'firebase' | 'local'
  db:null,
  data:{ clients:[], services:[], appointments:[], transactions:[], recurringExpenses:[], assessments:[], settings:[], bankAccounts:[], bankAccountHistory:[], bankAccountTotalHistory:[] },
  apptsLoaded:false, // true assim que a 1ª foto do Firestore de "appointments" chega (evita corrida com o GCal)
  listeners:[],
  onChange(cb){ this.listeners.push(cb); },
  emit(){ this.listeners.forEach(cb=>cb()); },
  localSave(){ try{ localStorage.setItem('recoveryhub_data', JSON.stringify(this.data)); }catch(e){} },
  localLoad(){ try{ const raw=localStorage.getItem('recoveryhub_data'); if(raw) this.data={...this.data, ...JSON.parse(raw)}; }catch(e){} },

  async init(){
    if(typeof firebaseDb!=='undefined' && firebaseDb){
      this.db=firebaseDb; this.mode='firebase';
      setSyncPill('firebase');
      ['clients','services','appointments','transactions','recurringExpenses','assessments','settings','bankAccounts','bankAccountHistory','bankAccountTotalHistory'].forEach(coll=>{
        this.db.collection(coll).onSnapshot(snap=>{
          this.data[coll]=snap.docs.map(d=>({id:d.id,...d.data()}));
          if(coll==='appointments') this.apptsLoaded = true;
          this.emit();
        }, err=>{ console.warn('firebase error',coll,err); setSyncPill('error'); });
      });
      // seed default services once, if empty
      setTimeout(async ()=>{
        try{
          const snap = await this.db.collection('services').get();
          if(snap.empty){ seedServices().forEach(s=> this.db.collection('services').add(s)); }
        }catch(e){}
      }, 800);
    } else {
      this.mode='local';
      setSyncPill('local');
      this.localLoad();
      if(this.data.services.length===0){ this.data.services = seedServices().map(s=>({id:uid(),...s})); this.localSave(); }
      this.emit();
    }
  },

  async add(coll,obj){
    obj.createdAt = obj.createdAt || new Date().toISOString();
    if(this.mode==='firebase'){
      const ref = await this.db.collection(coll).add(obj);
      return ref.id;
    } else {
      const id=uid(); this.data[coll].push({id,...obj}); this.localSave(); this.emit(); return id;
    }
  },
  async update(coll,id,patch){
    if(this.mode==='firebase'){
      await this.db.collection(coll).doc(id).update(patch);
    } else {
      const arr=this.data[coll]; const i=arr.findIndex(x=>x.id===id); if(i>-1){ arr[i]={...arr[i],...patch}; this.localSave(); this.emit(); }
    }
  },
  async remove(coll,id){
    if(this.mode==='firebase'){
      await this.db.collection(coll).doc(id).delete();
    } else {
      this.data[coll]=this.data[coll].filter(x=>x.id!==id); this.localSave(); this.emit();
    }
  },
  async upsert(coll,id,patch){
    if(this.mode==='firebase'){
      await this.db.collection(coll).doc(id).set(patch, {merge:true});
    } else {
      const arr=this.data[coll]; const i=arr.findIndex(x=>x.id===id);
      if(i>-1) arr[i]={...arr[i],...patch}; else arr.push({id,...patch});
      this.localSave(); this.emit();
    }
  }
};

/* ---------- GOOGLE AGENDA (SYNC BIDIRECIONAL APP <-> GOOGLE CALENDAR) ---------- */
const GCAL_CLIENT_ID = '688111473723-tbncshjfhith77v84pntf1jnuq7vman4.apps.googleusercontent.com';
const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
const GCAL_TOKEN_KEY = 'recoveryhub_gcal_token';
const GCAL_FLAG_KEY = 'recoveryhub_gcal_connected';
const GCAL_PULL_PAST_DAYS = 7;
const GCAL_PULL_FUTURE_DAYS = 90;
const GCAL_PULL_INTERVAL_MS = 5*60*1000;

const GCal = {
  tokenClient: null,
  token: null,
  ready: false,
  onStatusChange: null,
  pulling: false,
  lastPullAt: null, // callback set by UI to refresh button state

  init(){
    this._loadToken();
    const trySetup = (tries)=>{
      if(typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
        this.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GCAL_CLIENT_ID,
          scope: GCAL_SCOPE,
          prompt: '',
          callback: (resp)=>{
            if(resp && resp.access_token){
              this._saveToken(resp.access_token, resp.expires_in);
              showToast('Google Agenda conectada');
              this.pullSync();
            } else if(resp && resp.error && resp.error!=='immediate_failed_no_gis'){
              // silent renewal failed quietly; user-triggered connect failures still get feedback
            }
            if(this.onStatusChange) this.onStatusChange();
          }
        });
        this.ready = true;
        // Não tenta renovar o token automaticamente ao abrir o app — isso é o que abria a
        // janela de login do Google toda vez. Só sincroniza sozinho se já existir um token
        // válido em cache; caso contrário, a renovação só acontece quando o usuário interage
        // de fato (botão "Sincronizar agora", "Conectar Google Agenda" ou ao salvar um agendamento).
        if(this.isConnected() && this.token){
          setTimeout(()=>this.pullSync(), 2500);
        }
        if(this.onStatusChange) this.onStatusChange();
      } else if(tries>0){
        setTimeout(()=>trySetup(tries-1), 400);
      }
    };
    trySetup(20);
  },

  _loadToken(){
    try{
      const raw = localStorage.getItem(GCAL_TOKEN_KEY);
      if(raw){
        const {token, expiresAt} = JSON.parse(raw);
        if(token && expiresAt > Date.now()+30000){ this.token = token; return; }
      }
    }catch(e){}
    this.token = null;
  },
  _saveToken(token, expiresIn){
    this.token = token;
    const expiresAt = Date.now() + (Number(expiresIn)||3000)*1000;
    try{
      localStorage.setItem(GCAL_TOKEN_KEY, JSON.stringify({token, expiresAt}));
      localStorage.setItem(GCAL_FLAG_KEY, '1');
    }catch(e){}
  },
  isConnected(){ return localStorage.getItem(GCAL_FLAG_KEY)==='1'; },
  hasValidToken(){ this._loadToken(); return !!this.token; },

  silentRenew(){
    if(!this.tokenClient) return;
    try{ this.tokenClient.requestAccessToken({prompt:''}); }catch(e){}
  },
  connect(){
    if(!this.tokenClient){ showToast('Carregando Google Agenda, tente novamente em instantes'); return; }
    try{ this.tokenClient.requestAccessToken({prompt:'consent'}); }catch(e){ showToast('Não foi possível conectar ao Google Agenda'); }
  },
  disconnect(){
    this.token = null;
    try{ localStorage.removeItem(GCAL_TOKEN_KEY); localStorage.removeItem(GCAL_FLAG_KEY); }catch(e){}
    showToast('Google Agenda desconectada neste dispositivo');
    if(this.onStatusChange) this.onStatusChange();
  },

  async _ensureToken(){
    this._loadToken();
    if(this.token) return this.token;
    if(this.isConnected() && this.tokenClient){
      await new Promise(resolve=>{
        const prevCb = this.tokenClient.callback;
        this.tokenClient.callback = (resp)=>{
          this.tokenClient.callback = prevCb;
          if(resp && resp.access_token) this._saveToken(resp.access_token, resp.expires_in);
          if(prevCb) prevCb(resp);
          resolve();
        };
        try{ this.tokenClient.requestAccessToken({prompt:''}); }catch(e){ resolve(); }
        setTimeout(resolve, 2500);
      });
      this._loadToken();
    }
    return this.token;
  },

  async _apiFetch(url, opts){
    const token = await this._ensureToken();
    if(!token) return null;
    try{
      const res = await fetch(url, {...opts, headers:{...(opts.headers||{}), 'Authorization':'Bearer '+token, 'Content-Type':'application/json'}});
      if(res.status===401){ this.token=null; try{localStorage.removeItem(GCAL_TOKEN_KEY);}catch(e){} return null; }
      return res;
    }catch(e){ console.warn('Google Agenda: falha de rede', e); return null; }
  },

  apptToEvent(appt){
    const time = appt.time || '09:00';
    const start = `${appt.date}T${time}:00`;
    const end = new Date(`${appt.date}T${time}:00`);
    end.setMinutes(end.getMinutes() + 50);
    const pad = n=>String(n).padStart(2,'0');
    const endStr = `${appt.date}T${pad(end.getHours())}:${pad(end.getMinutes())}:00`;
    const statusLabel = APPT_STATUS[appt.status]?.label || '';
    return {
      summary: `${appt.serviceName||'Atendimento'} — ${appt.clientName||''}`,
      description: [appt.notes||'', statusLabel?`Status: ${statusLabel}`:''].filter(Boolean).join('\n'),
      start:{ dateTime: start, timeZone:'America/Sao_Paulo' },
      end:{ dateTime: endStr, timeZone:'America/Sao_Paulo' }
    };
  },

  async syncUpsert(appt){
    if(!this.isConnected() || !appt) return;
    try{
      const event = this.apptToEvent(appt);
      if(appt.googleEventId){
        const res = await this._apiFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${appt.googleEventId}`, {method:'PATCH', body: JSON.stringify(event)});
        if(res && res.ok) return;
        if(res && res.status!==404) return; // some other error, don't duplicate
      }
      const res2 = await this._apiFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {method:'POST', body: JSON.stringify(event)});
      if(res2 && res2.ok){
        const data = await res2.json();
        if(data && data.id) await Store.update('appointments', appt.id, {googleEventId: data.id});
      }
    }catch(e){ console.warn('Google Agenda: falha ao sincronizar evento', e); }
  },

  async syncDelete(appt){
    if(!this.isConnected() || !appt || !appt.googleEventId) return;
    try{ await this._apiFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${appt.googleEventId}`, {method:'DELETE'}); }
    catch(e){ console.warn('Google Agenda: falha ao remover evento', e); }
  },

  _pullRangeISO(){
    const pad=n=>String(n).padStart(2,'0');
    const now = new Date();
    const start = new Date(now); start.setDate(start.getDate()-GCAL_PULL_PAST_DAYS); start.setHours(0,0,0,0);
    const end = new Date(now); end.setDate(end.getDate()+GCAL_PULL_FUTURE_DAYS); end.setHours(23,59,59,999);
    const toISO = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return { start, end, startISO: toISO(start), endISO: toISO(end) };
  },

  async listEvents(){
    const {start, end} = this._pullRangeISO();
    const baseParams = { timeMin: start.toISOString(), timeMax: end.toISOString(), singleEvents:'true', orderBy:'startTime', maxResults:'2500' };
    let items = [];
    let pageToken = '';
    try{
      do{
        const params = new URLSearchParams({...baseParams, ...(pageToken?{pageToken}:{})});
        const res = await this._apiFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?${params.toString()}`, {method:'GET'});
        if(!res || !res.ok) return items.length?items:null;
        const data = await res.json();
        items = items.concat(data.items||[]);
        pageToken = data.nextPageToken || '';
      } while(pageToken);
    }catch(e){ console.warn('Google Agenda: falha ao listar eventos', e); return null; }
    return items;
  },

  _matchClient(text){
    const norm = normalizeSearch(text);
    if(!norm) return null;
    const clients = Store.data.clients||[];
    let found = clients.find(c=>normalizeSearch(c.name)===norm);
    if(found) return found;
    found = clients.find(c=>{ const cn=normalizeSearch(c.name); return cn && cn.length>2 && (norm.includes(cn) || cn.includes(norm)); });
    return found||null;
  },

  eventToApptPayload(ev){
    const startDt = ev.start && ev.start.dateTime;
    if(!startDt) return null; // ignora eventos de dia inteiro (sem horário)
    const d = new Date(startDt);
    const pad = n=>String(n).padStart(2,'0');
    const date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const summary = (ev.summary||'').trim();
    const client = this._matchClient(summary);
    return {
      date, time,
      clientId: client? client.id : '',
      clientName: client? client.name : (summary? summary.toUpperCase() : 'EVENTO SEM TÍTULO'),
      serviceId: '',
      serviceName: '',
      price: 0,
      status: 'agendado',
      paymentStatus: 'pendente',
      notes: [ev.description||'', (summary && !client) ? `Evento original do Google: ${summary}` : ''].filter(Boolean).join('\n').trim(),
      googleEventId: ev.id,
      gcalSource: 'google',
      needsReview: !client
    };
  },

  async pullSync(){
    if(!this.isConnected() || this.pulling) return {imported:0, updated:0, cancelled:0};
    this.pulling = true;
    const result = {imported:0, updated:0, cancelled:0};
    try{
      // Espera os agendamentos já carregados do Firestore antes de comparar com o Google.
      // Sem isso, uma sincronização disparada logo na abertura do app podia rodar antes dos
      // dados chegarem e recriar agendamentos que já existiam (duplicando-os).
      for(let tries=0; tries<40 && !Store.apptsLoaded; tries++){ await new Promise(r=>setTimeout(r,150)); }

      const events = await this.listEvents();
      if(!events){ return result; }
      const {startISO, endISO} = this._pullRangeISO();
      const byGid = {};
      events.forEach(ev=>{ if(ev.id) byGid[ev.id]=ev; });
      const appts = Store.data.appointments||[];

      for(const ev of events){
        if(ev.status==='cancelled') continue;
        const payload = this.eventToApptPayload(ev);
        if(!payload) continue;
        const existing = appts.find(a=>a.googleEventId===ev.id);
        if(existing){
          if(existing.gcalSource==='google'){
            // O evento ainda existe e está ativo no Google — se o app tinha marcado esse
            // agendamento como cancelado (por engano, ex. numa sincronização anterior com falha),
            // o Google é a fonte da verdade: reativa.
            const wasWronglyCancelled = existing.status==='cancelado';
            const changed = existing.date!==payload.date || existing.time!==payload.time || (payload.clientId && payload.clientId!==existing.clientId) || wasWronglyCancelled;
            if(changed){
              await Store.update('appointments', existing.id, {
                date: payload.date, time: payload.time,
                ...(wasWronglyCancelled ? {status:'agendado'} : {}),
                ...(payload.clientId ? {clientId:payload.clientId, clientName:payload.clientName, needsReview:false} : {})
              });
              result.updated++;
            }
          } else {
            if(existing.date!==payload.date || existing.time!==payload.time){
              await Store.update('appointments', existing.id, {date:payload.date, time:payload.time});
              result.updated++;
            }
          }
        } else {
          await Store.add('appointments', payload);
          result.imported++;
        }
      }

      const missing = appts.filter(a=> a.gcalSource==='google' && a.googleEventId && !byGid[a.googleEventId] && a.date>=startISO && a.date<=endISO && a.status!=='cancelado');
      for(const a of missing){
        await Store.update('appointments', a.id, {status:'cancelado', notes:[a.notes||'', 'Cancelado no Google Agenda'].filter(Boolean).join('\n')});
        result.cancelled++;
      }

      this.lastPullAt = new Date();
    }catch(e){ console.warn('Google Agenda: falha na sincronização de entrada', e); }
    finally{ this.pulling = false; }
    return result;
  }
};

function setSyncPill(mode){
  const dot=document.getElementById('sync-dot'); const text=document.getElementById('sync-text');
  dot.classList.remove('local');
  if(mode==='firebase'){ text.textContent='Sincronizado com a equipe'; }
  else if(mode==='error'){ dot.classList.add('local'); text.textContent='Erro de conexão — ver console'; }
  else { dot.classList.add('local'); text.textContent='Modo local (só este aparelho)'; }
}

/* ---------- MODAL HELPERS ---------- */
function openModal(html, onMount, opts){
  const root=document.getElementById('modal-root');
  const wide = opts && opts.wide;
  root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('#modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
  root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click', closeModal));
  if(onMount) onMount(root);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function renderDashboard(root, actions){
  if(actions) actions.innerHTML = `<button class="btn" id="btn-abs-settings">${icon('settings')}<span>Notificação de ausentes</span></button>`;
  const {clients,appointments,transactions}=Store.data;
  const today=todayISO();
  const thisMonth=monthKey(today);
  const revThisMonth = transactions.filter(t=>t.type==='receita'&&monthKey(t.date)===thisMonth).reduce((s,t)=>s+Number(t.amount||0),0);
  const expThisMonth = transactions.filter(t=>t.type==='despesa'&&monthKey(t.date)===thisMonth).reduce((s,t)=>s+Number(t.amount||0),0);
  const saldo = revThisMonth-expThisMonth;
  const activeClients = clients.filter(c=>c.status!=='inativo').length;
  const todaysAppts = appointments.filter(a=>a.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const concluded = appointments.filter(a=>a.status==='concluido');
  const ticket = concluded.length? concluded.reduce((s,a)=>s+Number(a.price||0),0)/concluded.length : 0;

  // last 6 months revenue
  const months=[];

function thSort(label, key, sortState){
  const active = sortState.key===key;
  const arrow = active ? (sortState.dir==='asc' ? '&#9650;' : '&#9660;') : '&#9650;';
  return `<th class="th-sort" data-sort="${key}">${escapeHtml(label)} <span class="sort-arrow${active?' active':''}">${arrow}</span></th>`;
}
function bindSortHeaders(root, sortState, onChange){
  root.querySelectorAll('[data-sort]').forEach(th=>th.addEventListener('click', ()=>{
    const key = th.dataset.sort;
    if(sortState.key===key) sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
    else { sortState.key=key; sortState.dir='asc'; }
    onChange();
  }));
}
function compareBy(dir, a, b){
  let r;
  if(typeof a==='string' || typeof b==='string') r = String(a||'').localeCompare(String(b||''), 'pt-BR', {sensitivity:'base', numeric:true});
  else r = (Number(a)||0) - (Number(b)||0);
  return dir==='asc' ? r : -r;
}
function exportClientsExcel(){
  const {clients, appointments, transactions} = Store.data;

    const appts = appointments.filter(a=>a.clientId===c.id);
    const spent = transactions.filter(t=>t.type==='receita'&&t.clientId===c.id).reduce((s,t)=>s+Number(t.amount||0),0);
    return {
      'Nome': c.name||'', 'CPF': c.cpf||'', 'Nascimento': c.birthDate?fmtDate(c.birthDate):'', 'Telefone': c.phone||'', 'E-mail': c.email||'',

}

async function suggestClientTiers(){
  const {clients, transactions} = Store.data;
  const withSpend = clients.map(c=>({ c, spent: transactions.filter(t=>t.type==='receita'&&t.clientId===c.id).reduce((s,t)=>s+Number(t.amount||0),0) })).filter(x=>x.spent>0).sort((a,b)=>b.spent-a.spent);
  if(withSpend.length===0){ showToast('Ainda não há receitas registradas para sugerir categorias'); return; }
  if(!confirm(`Sugerir categoria Ouro/Prata/Bronze para ${withSpend.length} cliente(s) com receita registrada, com base no total gasto? Isso substitui a categoria atual desses clientes.`)) return;
  const n=withSpend.length;
  const ouroCut = Math.max(1, Math.ceil(n*0.2));
  const prataCut = Math.max(ouroCut, Math.ceil(n*0.5));
  for(let i=0;i<n;i++){
    const tier = i<ouroCut ? 'ouro' : (i<prataCut ? 'prata' : 'bronze');
    await Store.update('clients', withSpend[i].c.id, {tier});
  }
  showToast('Categorias sugeridas aplicadas');
}

function formatCPF(v){
  v=(v||'').replace(/\D/g,'').slice(0,11);
  v=v.replace(/(\d{3})(\d)/,'$1.$2');
  v=v.replace(/(\d{3})(\d)/,'$1.$2');
  v=v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return v;
}
function isValidCPF(v){
  const d=(v||'').replace(/\D/g,'');
  return d.length===0 || d.length===11;
}

const ACCOUNT_TYPES = { PF:{label:'Pessoa Física (PF)'}, PJ:{label:'Pessoa Jurídica (PJ)'} };

function monthShortLabel(monthKeyStr){
  const short = new Date(monthKeyStr+'-02').toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
  return `${short}/${monthKeyStr.slice(2,4)}`;
}
function aggregateMonthlySeries(entries){
  // entries: [{date(ISO timestamp), balance}] -> mantém, por mês, apenas o registro mais recente
  const byMonth = {};
  entries.forEach(e=>{
    const mk = (e.date||'').slice(0,7);
    if(!mk) return;
    if(!byMonth[mk] || (e.date > byMonth[mk].date)) byMonth[mk] = e;
  });
  return Object.keys(byMonth).sort().map(mk=>({month:mk, value:Number(byMonth[mk].balance)||0}));
}
function buildAccountsLineChartSVG(points){
  const W=640, H=220, padL=70, padR=20, padT=20, padB=34;
  const values = points.map(p=>p.value);
  let minV = Math.min(...values), maxV = Math.max(...values);
  if(minV===maxV){ const pad = Math.abs(minV)*0.1||1; minV-=pad; maxV+=pad; }
  const range = maxV-minV;
  minV -= range*0.12; maxV += range*0.12;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (points.length===1?innerW/2:(i/(points.length-1))*innerW);
  const y = v => padT + innerH - ((v-minV)/(maxV-minV))*innerH;
  const path = points.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const gridLines = [0,0.5,1].map(t=>{
    const yy = padT + innerH*t;
    const val = maxV - (maxV-minV)*t;
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmtMoney(val)}</text>`;
  }).join('');
  const dots = points.map((p,i)=>`
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="4" fill="var(--accent)"/>
    <text x="${x(i).toFixed(1)}" y="${(y(p.value)-10).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${fmtMoney(p.value)}</text>
    <text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${monthShortLabel(p.month)}</text>
  `).join('');
  return `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto;display:block;">
    ${gridLines}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg></div>`;
}

function renderAccounts(root, actions){
  actions.innerHTML = `<button class="btn btn-primary" id="btn-new-account">${icon('plus')}<span>Nova conta</span></button>`;
  actions.querySelector('#btn-new-account').addEventListener('click', ()=>openAccountForm());

  const bankAccounts = Store.data.bankAccounts||[];
  const accountHistory = Store.data.bankAccountHistory||[];
  const totalHistory = Store.data.bankAccountTotalHistory||[];
  const enriched = bankAccounts.map(a=>({a}));
  const ACCOUNT_SORT_VALUE = {
    bank: e=> e.a.bank||'',
    type: e=> ACCOUNT_TYPES[e.a.type]?.label || e.a.type || '',
    balance: e=> Number(e.a.balance)||0,
    updated: e=> e.a.updatedAt||'',
  };
  enriched.sort((x,y)=> compareBy(accountSort.dir, ACCOUNT_SORT_VALUE[accountSort.key](x), ACCOUNT_SORT_VALUE[accountSort.key](y)));
  const total = bankAccounts.reduce((s,a)=> s+(Number(a.balance)||0), 0);

  if(accountsChartKey!=='total' && !bankAccounts.some(a=>a.id===accountsChartKey)) accountsChartKey='total';
  const chartSeries = accountsChartKey==='total'
    ? aggregateMonthlySeries(totalHistory)
    : aggregateMonthlySeries(accountHistory.filter(h=>h.accountId===accountsChartKey));
  let chartHtml;
  if(chartSeries.length>=2) chartHtml = buildAccountsLineChartSVG(chartSeries);
  else if(chartSeries.length===1) chartHtml = `<div class="empty">${icon('ranking')}<p>Só há 1 mês registrado até agora. Atualize o saldo em outro mês para ver a evolução.</p></div>`;
  else chartHtml = `<div class="empty">${icon('ranking')}<p>Cadastre ou atualize contas em pelo menos 2 meses diferentes para ver o gráfico de evolução.</p></div>`;

  root.innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:minmax(200px,280px);margin-bottom:18px;">
      <div class="kpi"><div class="kpi-label">Saldo total em contas</div><div class="kpi-value tnum" style="color:${total>=0?'var(--good)':'var(--bad)'}">${fmtMoney(total)}</div><div class="kpi-delta flat">${bankAccounts.length} conta(s)</div></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head">
        <h3>Evolução mensal de saldos</h3>
        <select id="accounts-chart-select" style="min-width:220px;">
          <option value="total" ${accountsChartKey==='total'?'selected':''}>Total de todas as contas</option>
          ${bankAccounts.map(a=>`<option value="${a.id}" ${accountsChartKey===a.id?'selected':''}>${escapeHtml(a.bank)} (${a.type})</option>`).join('')}
        </select>
      </div>
      <div class="card-body">${chartHtml}</div>
    </div>
    <div class="card">
      <div class="card-body tight">
        ${bankAccounts.length===0 ? `<div class="empty">${icon('cash')}<p>Nenhuma conta cadastrada ainda.</p><button class="btn btn-primary" id="empty-new-account">${icon('plus')}Nova conta</button></div>` :
        `<div class="table-wrap"><table>
          <thead><tr>${thSort('Banco','bank',accountSort)}${thSort('Tipo de conta','type',accountSort)}${thSort('Saldo','balance',accountSort)}${thSort('Última atualização','updated',accountSort)}<th></th></tr></thead>
          <tbody>${enriched.map(({a})=>`
            <tr>
              <td class="cell-strong">${escapeHtml(a.bank)}</td>
              <td><span class="badge muted">${escapeHtml(ACCOUNT_TYPES[a.type]?.label || a.type || '—')}</span></td>
              <td class="tnum cell-strong" style="color:${Number(a.balance)<0?'var(--bad)':'inherit'}">${fmtMoney(a.balance)}</td>
              <td class="tnum">${a.updatedAt?fmtDate(a.updatedAt.slice(0,10)):'—'}</td>
              <td><div class="row-actions">
                <button class="btn btn-ghost icon-btn" data-edit="${a.id}">${icon('edit')}</button>
                <button class="btn btn-ghost icon-btn btn-danger" data-del="${a.id}">${icon('trash')}</button>
              </div></td>
            </tr>`).join('')}</tbody>
        </table></div>`}
      </div>
    </div>
  `;
  const emptyBtn = root.querySelector('#empty-new-account'); if(emptyBtn) emptyBtn.addEventListener('click', ()=>openAccountForm());
  bindSortHeaders(root, accountSort, ()=>renderAccounts(root,actions));
  const chartSel = root.querySelector('#accounts-chart-select');
  if(chartSel) chartSel.addEventListener('change', e=>{ accountsChartKey=e.target.value; renderAccounts(root,actions); });
  root.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openAccountForm(bankAccounts.find(a=>a.id===b.dataset.edit))));
  root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Remover esta conta? Isso não afeta o Financeiro.')){
      const id = b.dataset.del;
      Store.remove('bankAccounts', id).then(()=>{
        const newTotal = bankAccounts.filter(a=>a.id!==id).reduce((s,a)=>s+(Number(a.balance)||0),0);
        Store.add('bankAccountTotalHistory', { balance:newTotal, date:new Date().toISOString() });
      });
      showToast('Conta removida');
    }
  }));
}

function openAccountForm(existing){
  const isEdit=!!existing;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Editar conta':'Nova conta'}</h3><button class="btn btn-ghost icon-btn" data-close-modal>${icon('close')}</button></div>
    <div class="modal-body">
      <p class="muted" style="font-size:11.5px;margin-top:0;">Cadastro manual só para controle — não tem vínculo com o Financeiro do app.</p>
      <div class="field"><label>Nome do banco</label><input id="f-bank" value="${escapeHtml(existing?.bank||'')}" placeholder="Ex: Banco do Brasil"/></div>
      <div class="field"><label>Tipo de conta</label>
        <select id="f-type">
          <option value="PF" ${!existing||existing.type==='PF'?'selected':''}>Pessoa Física (PF)</option>
          <option value="PJ" ${existing?.type==='PJ'?'selected':''}>Pessoa Jurídica (PJ)</option>
        </select>
      </div>
      <div class="field"><label>Saldo (R$)</label><input id="f-balance" type="number" step="0.01" value="${existing?.balance??''}" placeholder="0,00"/></div>
      ${existing?.updatedAt ? `<p class="muted" style="font-size:11px;">Última atualização: ${fmtDate(existing.updatedAt.slice(0,10))}</p>` : ''}
    </div>
    <div class="modal-foot"><button class="btn" data-close-modal>Cancelar</button><button class="btn btn-primary" id="f-save">${icon('check')}Salvar</button></div>
  `, root=>{
    forceUpperCase(root.querySelector('#f-bank'));
    root.querySelector('#f-save').addEventListener('click', async ()=>{
      const bank=root.querySelector('#f-bank').value.trim().toUpperCase();
      if(!bank){ showToast('Informe o nome do banco'); return; }
      const type = root.querySelector('#f-type').value;
      const balance = Number(root.querySelector('#f-balance').value)||0;
      const now = new Date().toISOString();
      const payload={ bank, type, balance, updatedAt: now };
      let id;
      if(isEdit){ id = existing.id; await Store.update('bankAccounts', id, payload); }
      else { id = await Store.add('bankAccounts', payload); }
      await Store.add('bankAccountHistory', { accountId:id, bank, type, balance, date: now });
      const current = Store.data.bankAccounts||[];
      const total = isEdit
        ? current.reduce((s,a)=> s + (a.id===id ? balance : (Number(a.balance)||0)), 0)
        : current.reduce((s,a)=> s + (a.id===id ? 0 : (Number(a.balance)||0)), 0) + balance;
      await Store.add('bankAccountTotalHistory', { balance: total, date: now });
      showToast(isEdit?'Conta atualizada':'Conta cadastrada'); closeModal();
    });
  });
}

/* ---------- AGENDA ---------- */
let agendaFilter='upcoming';
let agendaViewMode='list'; // 'list' | 'week' | 'month'
let agendaWeekStart=null; // ISO date (Monday) of the shown week; null = week of today
let agendaMonthKey=null; // 'YYYY-MM'; null = current month
let agendaSelectedDay=null; // ISO date selected in month view

function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDaysISO(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return toISODate(d); }
function weekStartISO(dateStr){ const d=new Date(dateStr+'T00:00:00'); const dow=d.getDay(); const diff=(dow===0?-6:1-dow); d.setDate(d.getDate()+diff); return toISODate(d); }
function addMonthsKey(monthStr, n){ const [y,m]=monthStr.split('-').map(Number); const d=new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
const WEEKDAY_LABELS=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTH_LABELS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function exportAgendaExcel(list){
  const rows = list.map(a=>({
    'Data': fmtDate(a.date), 'Hora': a.time||'', 'Cliente': a.clientName||'', 'Serviço': a.serviceName||'',
    'Valor (R$)': Number(a.price)||0, 'Status': APPT_STATUS[a.status]?.label||a.status||'',
    'Pagamento': PAY_STATUS[a.paymentStatus||'pendente']?.label||'', 'Observações': a.notes||''
  }));
  exportToExcel('agenda-elitelab.xlsx', {'Agenda': rows});
}

function apptRowHTML(a, withDate){
  return `<tr>
    ${withDate?`<td class="tnum">${fmtDate(a.date)}</td>`:''}
    <td class="tnum">${a.time||'—'}</td>
    <td class="cell-strong">${a.gcalSource==='google'?`<span class="badge ${a.needsReview?'warn':'muted'}" title="${a.needsReview?'Importado do Google Agenda — revisar cliente/serviço':'Importado do Google Agenda'}">G</span> `:''}${escapeHtml(a.clientName)}</td>
    <td>${escapeHtml(a.serviceName)||'—'}</td>
    <td class="tnum">${fmtMoney(a.price)}</td>
    <td><span class="badge ${APPT_STATUS[a.status]?.cls}">${APPT_STATUS[a.status]?.label}</span></td>
    <td><span class="badge ${PAY_STATUS[a.paymentStatus||'pendente']?.cls}">${PAY_STATUS[a.paymentStatus||'pendente']?.label}</span></td>
    <td><div class="row-actions">
      ${a.status==='agendado'?`<button class="btn btn-sm" data-done="${a.id}">Concluir</button>`:''}
      <button class="btn btn-ghost icon-btn" data-edit="${a.id}">${icon('edit')}</button>
      <button class="btn btn-ghost icon-btn btn-danger" data-del="${a.id}">${icon('trash')}</button>
    </div></td>
  </tr>`;
}

function renderAgenda(root, actions){
  const gcalOn = GCal.isConnected();
  const lastSync = GCal.lastPullAt ? `${String(GCal.lastPullAt.getHours()).padStart(2,'0')}:${String(GCal.lastPullAt.getMinutes()).padStart(2,'0')}` : null;
  actions.innerHTML = `<button class="btn ${gcalOn?'':'btn-primary'}" id="btn-gcal">${icon('agenda')}<span>${gcalOn?'Google Agenda conectada':'Conectar Google Agenda'}</span></button>${gcalOn?`<button class="btn" id="btn-gcal-sync" title="Importa agendamentos criados direto no Google Agenda">${icon('agenda')}<span>${GCal.pulling?'Sincronizando...':'Sincronizar agora'}</span></button>`:''}<button class="btn" id="btn-export-agenda">${icon('download')}<span>Exportar Excel</span></button><button class="btn btn-primary" id="btn-new-appt">${icon('plus')}<span>Novo agendamento</span></button>`;
  actions.querySelector('#btn-new-appt').addEventListener('click', ()=>openApptForm());
  actions.querySelector('#btn-gcal').addEventListener('click', ()=>{
    if(GCal.isConnected()){
      if(confirm('Desconectar a sincronização com o Google Agenda neste dispositivo?')) GCal.disconnect();
    } else {
      GCal.connect();
    }
  });
  const syncBtn = actions.querySelector('#btn-gcal-sync');
  if(syncBtn) syncBtn.addEventListener('click', async ()=>{
    if(GCal.pulling) return;
    renderAgenda(root, actions);
    const r = await GCal.pullSync();
    const parts = [];
    if(r.imported) parts.push(`${r.imported} novo(s) importado(s)`);
    if(r.updated) parts.push(`${r.updated} atualizado(s)`);
    if(r.cancelled) parts.push(`${r.cancelled} cancelado(s)`);
    showToast(parts.length? `Google Agenda: ${parts.join(', ')}` : 'Google Agenda: nada novo para importar');
    renderAgenda(root, actions);
  });
  GCal.onStatusChange = ()=>{ if(currentView==='agenda') renderAgenda(root, actions); };

  const {appointments}=Store.data;
  const today=todayISO();

  const modesHTML = `
    <div class="tabs" id="agenda-modes">
      <button class="tab ${agendaViewMode==='list'?'active':''}" data-mode="list">Lista</button>
      <button class="tab ${agendaViewMode==='week'?'active':''}" data-mode="week">Semana</button>
      <button class="tab ${agendaViewMode==='month'?'active':''}" data-mode="month">Mês</button>
    </div>
  `;

  let bodyHTML = '';
  let exportList = [];

  if(agendaViewMode==='list'){
    let list = [...appointments];
    if(agendaFilter==='upcoming') list = list.filter(a=>a.date>=today && a.status==='agendado');
    else if(agendaFilter==='today') list = list.filter(a=>a.date===today);
    else if(agendaFilter==='done') list = list.filter(a=>a.status==='concluido');
    else if(agendaFilter==='cancel') list = list.filter(a=>a.status==='cancelado'||a.status==='faltou');
    list.sort((a,b)=> (a.date+((a.time)||'')).localeCompare(b.date+(b.time||'')));
    exportList = list;

    bodyHTML = `
      <div class="tabs" id="agenda-tabs" style="margin-top:12px;">
        <button class="tab ${agendaFilter==='upcoming'?'active':''}" data-f="upcoming">Próximos</button>
        <button class="tab ${agendaFilter==='today'?'active':''}" data-f="today">Hoje</button>
        <button class="tab ${agendaFilter==='done'?'active':''}" data-f="done">Concluídos</button>
        <button class="tab ${agendaFilter==='cancel'?'active':''}" data-f="cancel">Cancelados/Faltas</button>
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="card-body tight">
          ${list.length===0 ? `<div class="empty">${icon('agenda')}<p>Nenhum agendamento nesta visão.</p></div>` :
          `<div class="table-wrap"><table>
            <thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Pagamento</th><th></th></tr></thead>
            <tbody>${list.map(a=>apptRowHTML(a, true)).join('')}</tbody>
          </table></div>`}
        </div>
      </div>
    `;
  } else if(agendaViewMode==='week'){
    const weekStart = agendaWeekStart || weekStartISO(today);
    const days = Array.from({length:7}, (_,i)=> addDaysISO(weekStart, i));
    const weekEnd = days[6];
    const byDay = {};
    days.forEach(d=>byDay[d]=[]);
    appointments.forEach(a=>{ if(byDay[a.date]) byDay[a.date].push(a); });
    Object.values(byDay).forEach(arr=>arr.sort((a,b)=>(a.time||'').localeCompare(b.time||'')));
    exportList = days.flatMap(d=>byDay[d]);

    bodyHTML = `
      <div class="agenda-nav">
        <button class="btn btn-ghost icon-btn" id="week-prev">‹</button>
        <h3>${fmtDateShort(weekStart)} – ${fmtDate(weekEnd)}</h3>
        <div class="flex gap8">
          <button class="btn btn-sm" id="week-today">Hoje</button>
          <button class="btn btn-ghost icon-btn" id="week-next">›</button>
        </div>
      </div>
      <div class="week-grid">
        ${days.map(d=>{
          const list = byDay[d];
          const isToday = d===today;
          const dow = new Date(d+'T00:00:00').getDay();
          return `<div class="week-day ${isToday?'is-today':''}">
            <div class="week-day-head"><span>${WEEKDAY_LABELS[dow]}</span><span class="num">${d.slice(8,10)}</span></div>
            ${list.length===0? `<div class="week-empty">—</div>` : list.map(a=>`
              <div class="week-appt status-${a.status}" data-edit="${a.id}">
                <span class="t">${a.time||'—'}</span> ${a.gcalSource==='google'?`<span class="badge ${a.needsReview?'warn':'muted'}" style="padding:1px 4px;font-size:9px;">G</span> `:''}${escapeHtml(a.clientName)}
                <div class="muted" style="font-size:10.5px;">${escapeHtml(a.serviceName)||'—'}</div>
              </div>
            `).join('')}
          </div>`;
        }).join('')}
      </div>
    `;
  } else if(agendaViewMode==='month'){
    const monthKey_ = agendaMonthKey || today.slice(0,7);
    const [y,m] = monthKey_.split('-').map(Number);
    const startOffset = new Date(y, m-1, 1).getDay();
    const daysInMonthCount = new Date(y, m, 0).getDate();
    const byDay = {};
    appointments.forEach(a=>{ if(a.date && a.date.slice(0,7)===monthKey_){ (byDay[a.date]=byDay[a.date]||[]).push(a); } });
    Object.values(byDay).forEach(arr=>arr.sort((a,b)=>(a.time||'').localeCompare(b.time||'')));
    exportList = Object.values(byDay).flat();

    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(null);
    for(let day=1; day<=daysInMonthCount; day++) cells.push(`${monthKey_}-${String(day).padStart(2,'0')}`);

    const selectedDay = (agendaSelectedDay && agendaSelectedDay.slice(0,7)===monthKey_) ? agendaSelectedDay : null;
    const selectedList = selectedDay ? (byDay[selectedDay]||[]) : [];

    bodyHTML = `
      <div class="agenda-nav">
        <button class="btn btn-ghost icon-btn" id="month-prev">‹</button>
        <h3>${MONTH_LABELS[m-1]} de ${y}</h3>
        <div class="flex gap8">
          <button class="btn btn-sm" id="month-today">Hoje</button>
          <button class="btn btn-ghost icon-btn" id="month-next">›</button>
        </div>
      </div>
      <div class="month-grid">
        ${WEEKDAY_LABELS.map(w=>`<div class="month-dow">${w}</div>`).join('')}
        ${cells.map(d=>{
          if(!d) return `<div class="month-day empty"></div>`;
          const list = byDay[d]||[];
          const isToday = d===today;
          const isSelected = d===selectedDay;
          return `<div class="month-day ${isToday?'is-today':''} ${isSelected?'is-selected':''}" data-day="${d}">
            <div class="num">${d.slice(8,10)}</div>
            ${list.length>0?`<div class="dots">${list.slice(0,8).map(a=>`<span class="month-dot status-${a.status}"></span>`).join('')}</div><div class="more">${list.length} agend.</div>`:''}
          </div>`;
        }).join('')}
      </div>
      ${selectedDay ? `
      <div class="card" style="margin-top:16px;">
        <div class="card-head"><h3>${fmtDate(selectedDay)}</h3></div>
        <div class="card-body tight">
          ${selectedList.length===0? `<div class="empty">${icon('agenda')}<p>Nenhum agendamento neste dia.</p></div>` :
          `<div class="table-wrap"><table>
            <thead><tr><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Pagamento</th><th></th></tr></thead>
            <tbody>${selectedList.map(a=>apptRowHTML(a, false)).join('')}</tbody>
          </table></div>`}
        </div>
      </div>` : ''}
    `;
  }

  root.innerHTML = modesHTML + bodyHTML;

  root.querySelectorAll('#agenda-modes .tab').forEach(t=>t.addEventListener('click', ()=>{ agendaViewMode=t.dataset.mode; renderAgenda(root,actions); }));

  if(agendaViewMode==='list'){
    root.querySelectorAll('#agenda-tabs .tab').forEach(t=>t.addEventListener('click', ()=>{ agendaFilter=t.dataset.f; renderAgenda(root,actions); }));
  } else if(agendaViewMode==='week'){
    root.querySelector('#week-prev').addEventListener('click', ()=>{ agendaWeekStart = addDaysISO(agendaWeekStart||weekStartISO(today), -7); renderAgenda(root,actions); });
    root.querySelector('#week-next').addEventListener('click', ()=>{ agendaWeekStart = addDaysISO(agendaWeekStart||weekStartISO(today), 7); renderAgenda(root,actions); });
    root.querySelector('#week-today').addEventListener('click', ()=>{ agendaWeekStart=null; renderAgenda(root,actions); });
  } else if(agendaViewMode==='month'){
    root.querySelector('#month-prev').addEventListener('click', ()=>{ agendaMonthKey = addMonthsKey(agendaMonthKey||today.slice(0,7), -1); agendaSelectedDay=null; renderAgenda(root,actions); });
    root.querySelector('#month-next').addEventListener('click', ()=>{ agendaMonthKey = addMonthsKey(agendaMonthKey||today.slice(0,7), 1); agendaSelectedDay=null; renderAgenda(root,actions); });
    root.querySelector('#month-today').addEventListener('click', ()=>{ agendaMonthKey=null; agendaSelectedDay=today; renderAgenda(root,actions); });
    root.querySelectorAll('.month-day[data-day]').forEach(el=>el.addEventListener('click', ()=>{ agendaSelectedDay = el.dataset.day===agendaSelectedDay? null : el.dataset.day; renderAgenda(root,actions); }));
  }

  root.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openApptForm(appointments.find(a=>a.id===b.dataset.edit))));
  root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Remover este agendamento?')){
      const appt = appointments.find(a=>a.id===b.dataset.del);
      if(appt) GCal.syncDelete(appt);
      Store.remove('appointments', b.dataset.del); showToast('Agendamento removido');
    }
  }));
  root.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click', ()=>completeAppointment(appointments.find(a=>a.id===b.dataset.done))));
  const exportAgendaBtn = actions.querySelector('#btn-export-agenda');
  if(exportAgendaBtn) exportAgendaBtn.addEventListener('click', ()=>exportAgendaExcel(exportList));
}

async function completeAppointment(appt){
  if(!appt) return;
  const pay = confirm('Marcar como concluído e registrar o pagamento agora?\nOK = concluído + pago   |   Cancelar = concluído, pagamento pendente');
  await Store.update('appointments', appt.id, {status:'concluido', paymentStatus: pay?'pago':'pendente'});
  if(pay){
    await Store.add('transactions', {type:'receita', amount:Number(appt.price)||0, description:`${appt.serviceName} — ${appt.clientName}`, category:'Atendimento', date: todayISO(), method:'—', clientId:appt.clientId, clientName:appt.clientName, serviceId:appt.serviceId, serviceName:appt.serviceName, appointmentId:appt.id});
  }
  GCal.syncUpsert({...appt, status:'concluido'});
  showToast('Agendamento concluído');
}

  const {clients, services} = Store.data;
  const clientItems = clients.map(c=>({id:c.id, label:c.name}));
  const serviceItems = services.map(s=>({id:s.id, label:s.name, sub:fmtMoney(s.price), price:s.price}));
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Editar agendamento':'Novo agendamento'}</h3><button class="btn btn-ghost icon-btn" data-close-modal>${icon('close')}</button></div>
    <div class="modal-body">

      </div>
      <div class="field"><label>Serviço</label>
        ${searchableSelectHTML('f-service', serviceItems, existing?.serviceId, services.length===0?'Cadastre um serviço primeiro':'Digite o nome do serviço...')}
      </div>
      <div class="field-row">
        <div class="field"><label>Data</label><input id="f-date" type="date" value="${existing?.date||todayISO()}"/></div>
        <div class="field"><label>Hora</label><input id="f-time" type="time" value="${existing?.time||'09:00'}"/></div>
      </div>

        <div class="field"><label>Status</label>
          <select id="f-status">${Object.entries(APPT_STATUS).map(([k,v])=>`<option value="${k}" ${existing?.status===k?'selected':''}>${v.label}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Observações</label><textarea id="f-notes">${escapeHtml(existing?.notes||'')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close-modal>Cancelar</button><button class="btn btn-primary" id="f-save">${icon('check')}Salvar</button></div>
  `, root=>{
    wireSearchableSelect(root, 'f-client', clientItems);
    wireSearchableSelect(root, 'f-service', serviceItems, item=>{
      if(!isEdit) root.querySelector('#f-price').value = item.price||0;
    });
    root.querySelector('#f-save').addEventListener('click', async ()=>{
      const clientId=root.querySelector('#f-client').value, serviceId=root.querySelector('#f-service').value;
      if(!clientId || !serviceId){ showToast('Selecione cliente e serviço'); return; }
      const client=clients.find(c=>c.id===clientId), service=services.find(s=>s.id===serviceId);
      const payload={ clientId, clientName:client?.name||'', serviceId, serviceName:service?.name||'', date:root.querySelector('#f-date').value||todayISO(), time:root.querySelector('#f-time').value, price:Number(root.querySelector('#f-price').value)||0, status:root.querySelector('#f-status').value, notes:root.querySelector('#f-notes').value.trim(), paymentStatus:existing?.paymentStatus||'pendente', ...(existing?.gcalSource==='google'?{needsReview:false}:{}) };
      if(isEdit){
        await Store.update('appointments', existing.id, payload);
        GCal.syncUpsert({...existing, ...payload, id:existing.id});
      } else {
        const newId = await Store.add('appointments', payload);
        GCal.syncUpsert({...payload, id:newId});
      }
      showToast(isEdit?'Agendamento atualizado':'Agendamento criado'); closeModal();
    });
  });
}

/* ---------- FINANCE ---------- */
let financeFilter='all';
let financeSort={key:'date', dir:'desc'};
let financeChartFrom=null; // 'YYYY-MM' — null até o primeiro render, quando é preenchido com os últimos 12 meses
let financeChartTo=null;   // 'YYYY-MM'
function generateDueRecurring(){
  const {recurringExpenses, transactions} = Store.data;
  if(!recurringExpenses || !recurringExpenses.length) return;
  const now = new Date();
  const curMonth = monthKey(todayISO());
  const todayDay = now.getDate();
  recurringExpenses.filter(r=>r.active!==false).forEach(r=>{
    const already = transactions.some(t=>t.recurringId===r.id && monthKey(t.date)===curMonth);
    const dueDay = Math.min(r.dayOfMonth||1, 28);
    if(!already && todayDay>=dueDay){
      const day = Math.min(dueDay, daysInMonth(now.getFullYear(), now.getMonth()));
      const dateStr = curMonth+'-'+String(day).padStart(2,'0');
      Store.add('transactions', { type:'despesa', description:r.description, amount:Number(r.amount)||0, category:r.category||'Fixa', date:dateStr, recurringId:r.id, clientId:null, clientName:null });
    }
  });
}

function exportFinanceExcel(list, recurringList){
  const txRows = list.map(t=>({
    'Data': fmtDate(t.date), 'Descrição': t.description||'', 'Categoria': t.category||'', 'Cliente': t.clientName||'',
    'Tipo': t.type==='receita'?'Receita':'Despesa', 'Valor (R$)': Number(t.amount)||0, 'Fixa/Recorrente': t.recurringId?'Sim':'Não'
  }));
  const recRows = recurringList.map(r=>({
    'Descrição': r.description||'', 'Categoria': r.category||'', 'Valor (R$)': Number(r.amount)||0,
    'Dia do mês': r.dayOfMonth||1, 'Status': r.active===false?'Pausada':'Ativa'
  }));
  exportToExcel('financeiro-elitelab.xlsx', {'Lançamentos': txRows, 'Despesas recorrentes': recRows});
}

function renderFinance(root, actions){
  actions.innerHTML = `<button class="btn" id="btn-export-finance">${icon('download')}<span>Exportar Excel</span></button><button class="btn btn-primary" id="btn-new-tx">${icon('plus')}<span>Novo lançamento</span></button>`;
  actions.querySelector('#btn-new-tx').addEventListener('click', ()=>openTxForm());

  generateDueRecurring();

  const {transactions, recurringExpenses}=Store.data;
  let list=[...transactions];
  if(financeFilter!=='all') list = list.filter(t=>t.type===financeFilter);
  const FINANCE_SORT_VALUE = {
    date: t=> t.date||'',
    description: t=> t.description||'',
    category: t=> t.category||'',
    clientName: t=> t.clientName||'',
    type: t=> t.type==='receita'?'Receita':'Despesa',
    amount: t=> Number(t.amount)||0,
