  const totalRev = transactions.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount||0),0);
  const totalExp = transactions.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount||0),0);

  // Faturamento x Despesas — período editável (padrão: últimos 12 meses)
  if(!financeChartTo) financeChartTo = currentMonthKey();
  if(!financeChartFrom) financeChartFrom = shiftMonthKey(financeChartTo, -11);
  const months = monthRangeKeys(financeChartFrom, financeChartTo).slice(-36); // trava em 36 meses pra não estourar o gráfico
  const monthLabels = months.map(m=> new Date(m+'-02').toLocaleDateString('pt-BR',{month:'short', year: months.length>12?'2-digit':undefined}).replace('.',''));
  const monthRev = months.map(m=> transactions.filter(t=>t.type==='receita'&&monthKey(t.date)===m).reduce((s,t)=>s+Number(t.amount||0),0));
  const monthExp = months.map(m=> transactions.filter(t=>t.type==='despesa'&&monthKey(t.date)===m).reduce((s,t)=>s+Number(t.amount||0),0));
  const monthSaldo = months.map((m,i)=> monthRev[i]-monthExp[i]);
  const maxMonthVal = Math.max(1, ...monthRev, ...monthExp, ...monthSaldo.map(v=>Math.abs(v)));

  const recurringList = (recurringExpenses||[]).slice().sort((a,b)=>(a.description||'').localeCompare(b.description||''));

  root.innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(3,minmax(160px,1fr));margin-bottom:18px;">
      <div class="kpi"><div class="kpi-label">Total recebido</div><div class="kpi-value tnum" style="color:var(--good)">${fmtMoney(totalRev)}</div></div>
      <div class="kpi"><div class="kpi-label">Total de despesas</div><div class="kpi-value tnum" style="color:var(--bad)">${fmtMoney(totalExp)}</div></div>
      <div class="kpi"><div class="kpi-label">Saldo acumulado</div><div class="kpi-value tnum">${fmtMoney(totalRev-totalExp)}</div></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head" style="flex-wrap:wrap;gap:10px;">
        <h3>Faturamento x Despesas${months.length?` — ${monthLabels[0]} a ${monthLabels[monthLabels.length-1]}`:''}</h3>
        <div class="flex gap10" style="font-size:11.5px;font-weight:600;">
          <span class="flex gap8"><span style="width:10px;height:10px;border-radius:3px;background:var(--blue);display:inline-block;"></span>Faturamento</span>
          <span class="flex gap8"><span style="width:10px;height:10px;border-radius:3px;background:var(--bad);display:inline-block;"></span>Despesas</span>
          <span class="flex gap8"><span style="width:10px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--good) 50%,var(--bad) 50%);display:inline-block;"></span>Saldo</span>
        </div>
      </div>
      <div class="card-body" style="border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:2px;">
        <div class="flex gap10" style="flex-wrap:wrap;align-items:flex-end;">
          <div class="field" style="margin:0;width:150px;"><label style="font-size:10.5px;">De</label><input type="month" id="fin-chart-from" value="${financeChartFrom}" style="padding:6px 8px;"/></div>
          <div class="field" style="margin:0;width:150px;"><label style="font-size:10.5px;">Até</label><input type="month" id="fin-chart-to" value="${financeChartTo}" style="padding:6px 8px;"/></div>
          <div class="flex gap6">
            <button class="btn btn-sm" data-chart-preset="6">6 meses</button>
            <button class="btn btn-sm" data-chart-preset="12">12 meses</button>
            <button class="btn btn-sm" data-chart-preset="24">24 meses</button>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div style="overflow-x:auto;">
        <div class="bars" style="${months.length>12?`min-width:${months.length*64}px;`:''}">
          ${months.map((m,i)=>`
            <div class="bar-col" style="${months.length>12?'flex:0 0 64px;':''}">
              <div class="bar-pair" style="display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center;">
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;">
                  <div class="bar-value tnum">${monthRev[i]>0?fmtCompactMoney(monthRev[i]):''}</div>
                  <div class="bar blue" style="height:${Math.max(3,(monthRev[i]/maxMonthVal)*100)}%;width:100%;" title="Faturamento ${fmtMoney(monthRev[i])}"></div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;">
                  <div class="bar-value tnum">${monthExp[i]>0?fmtCompactMoney(monthExp[i]):''}</div>
                  <div class="bar neg" style="height:${Math.max(3,(monthExp[i]/maxMonthVal)*100)}%;width:100%;" title="Despesas ${fmtMoney(monthExp[i])}"></div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;">
                  <div class="bar-value tnum">${monthSaldo[i]!==0?fmtCompactMoney(monthSaldo[i]):''}</div>
                  <div class="bar ${monthSaldo[i]<0?'neg':'pos'}" style="height:${Math.max(3,(Math.abs(monthSaldo[i])/maxMonthVal)*100)}%;width:100%;" title="Saldo ${fmtMoney(monthSaldo[i])}"></div>
                </div>
              </div>
              <div class="bar-label">${monthLabels[i]}</div>
            </div>`).join('')}
        </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>Despesas fixas e recorrentes</h3><button class="btn btn-sm" id="btn-new-recurring">${icon('plus')}Nova despesa recorrente</button></div>
      <div class="card-body tight">
        ${recurringList.length===0 ? `<div class="empty">${icon('cash')}<p>Nenhuma despesa fixa cadastrada. Cadastre aluguel, salários, mensalidades etc. para gerar o lançamento automaticamente todo mês.</p></div>` :
        `<div class="table-wrap"><table>
          <thead><tr><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Dia do mês</th><th>Status</th><th></th></tr></thead>
          <tbody>${recurringList.map(r=>`
            <tr>
              <td class="cell-strong">${escapeHtml(r.description)}</td>
              <td><span class="badge muted">${escapeHtml(r.category||'Fixa')}</span></td>
              <td class="tnum">${fmtMoney(r.amount)}</td>
              <td class="tnum">Todo dia ${r.dayOfMonth||1}</td>
              <td><span class="badge ${r.active===false?'muted':'good'}">${r.active===false?'Pausada':'Ativa'}</span></td>
              <td><div class="row-actions">
                <button class="btn btn-sm" data-toggle="${r.id}">${r.active===false?'Retomar':'Pausar'}</button>
                <button class="btn btn-ghost icon-btn btn-danger" data-del-recurring="${r.id}">${icon('trash')}</button>
              </div></td>
            </tr>`).join('')}</tbody>
        </table></div>`}
      </div>
    </div>

    <div class="tabs" id="fin-tabs">
      <button class="tab ${financeFilter==='all'?'active':''}" data-f="all">Todos</button>
      <button class="tab ${financeFilter==='receita'?'active':''}" data-f="receita">Receitas</button>
      <button class="tab ${financeFilter==='despesa'?'active':''}" data-f="despesa">Despesas</button>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="card-body tight">
        ${list.length===0? `<div class="empty">${icon('cash')}<p>Nenhum lançamento registrado.</p></div>` :
        `<div class="table-wrap"><table>
          <thead><tr>${thSort('Data','date',financeSort)}${thSort('Descrição','description',financeSort)}${thSort('Categoria','category',financeSort)}${thSort('Cliente','clientName',financeSort)}${thSort('Tipo','type',financeSort)}${thSort('Valor','amount',financeSort)}<th></th></tr></thead>
          <tbody>${list.map(t=>`
            <tr>
              <td class="tnum">${fmtDate(t.date)}</td>
              <td class="cell-strong">${escapeHtml(t.description||'—')}${t.recurringId?` <span class="badge muted" style="margin-left:4px;">Fixa</span>`:''}</td>

              <td>${escapeHtml(t.clientName||'—')}</td>

              <td><div class="row-actions"><button class="btn btn-ghost icon-btn btn-danger" data-del="${t.id}">${icon('trash')}</button></div></td>
            </tr>`).join('')}</tbody>
        </table></div>`}
      </div>

  `;
  root.querySelectorAll('#fin-tabs .tab').forEach(t=>t.addEventListener('click', ()=>{ financeFilter=t.dataset.f; renderFinance(root,actions); }));
  bindSortHeaders(root, financeSort, ()=>renderFinance(root,actions));
  const chartFromInput = root.querySelector('#fin-chart-from');
  const chartToInput = root.querySelector('#fin-chart-to');
  if(chartFromInput) chartFromInput.addEventListener('change', ()=>{ if(chartFromInput.value){ financeChartFrom=chartFromInput.value; renderFinance(root,actions); } });
  if(chartToInput) chartToInput.addEventListener('change', ()=>{ if(chartToInput.value){ financeChartTo=chartToInput.value; renderFinance(root,actions); } });
  root.querySelectorAll('[data-chart-preset]').forEach(b=>b.addEventListener('click', ()=>{
    const n = Number(b.dataset.chartPreset);
    financeChartTo = currentMonthKey();
    financeChartFrom = shiftMonthKey(financeChartTo, -(n-1));
    renderFinance(root,actions);
  }));
  root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Remover este lançamento?')){ Store.remove('transactions', b.dataset.del); showToast('Lançamento removido'); }
  }));
  root.querySelector('#btn-new-recurring').addEventListener('click', openRecurringForm);
  root.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', ()=>{
    const r = recurringList.find(x=>x.id===b.dataset.toggle);
    Store.update('recurringExpenses', r.id, {active: r.active===false});
  }));
  root.querySelectorAll('[data-del-recurring]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Remover esta despesa recorrente? Os lançamentos já gerados no histórico não serão apagados.')){ Store.remove('recurringExpenses', b.dataset.delRecurring); showToast('Despesa recorrente removida'); }
  }));
  const exportFinanceBtn = actions.querySelector('#btn-export-finance');
  if(exportFinanceBtn) exportFinanceBtn.addEventListener('click', ()=>exportFinanceExcel(list, recurringList));

/* ---------- RANKING ---------- */
const WEEKDAY_NAMES = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function weekdayIndex(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d)).getUTCDay();
}

let rankTab='clients-revenue';
let rankFrom = '';
let rankTo = '';
function renderRanking(root, actions){
  const {clients,services}=Store.data;
  const allAppointments = Store.data.appointments;
  const allTransactions = Store.data.transactions;
  const inPeriod = d => d && (!rankFrom || d>=rankFrom) && (!rankTo || d<=rankTo);
  const appointments = allAppointments.filter(a=>inPeriod(a.date));
  const transactions = allTransactions.filter(t=>inPeriod(t.date));
  const periodLabel = (rankFrom||rankTo) ? `Período: ${rankFrom?fmtDate(rankFrom):'início'} até ${rankTo?fmtDate(rankTo):'hoje'}` : 'Período: todo o histórico';

  const clientRevenue = clients.map(c=>({ c, value: transactions.filter(t=>t.type==='receita'&&t.clientId===c.id).reduce((s,t)=>s+Number(t.amount||0),0) })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const clientFreq = clients.map(c=>({ c, value: appointments.filter(a=>a.clientId===c.id && a.status==='concluido').length })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const serviceRevenue = services.map(s=>({ s, value: transactions.filter(t=>t.type==='receita'&&t.serviceId===s.id).reduce((sum,t)=>sum+Number(t.amount||0),0) })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const serviceCount = services.map(s=>({ s, value: appointments.filter(a=>a.serviceId===s.id && a.status==='concluido').length })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);

  // frequency by weekday — sessions realmente ocupadas (agendadas ou concluídas), excluindo canceladas/faltas
  const countedAppts = appointments.filter(a=>a.status==='agendado'||a.status==='concluido');
  const weekdayCounts = [0,0,0,0,0,0,0];
  countedAppts.forEach(a=>{ if(a.date){ weekdayCounts[weekdayIndex(a.date)]++; } });
  const totalWeekdaySessions = weekdayCounts.reduce((s,v)=>s+v,0);
  const weekdayRank = WEEKDAY_NAMES.map((name,idx)=>({ idx, name, value: weekdayCounts[idx] })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);

  const tabs = [
    {id:'clients-revenue', label:'Clientes por faturamento'},
    {id:'clients-freq', label:'Clientes por frequência'},
    {id:'services-revenue', label:'Serviços por faturamento'},
    {id:'services-count', label:'Serviços por volume'},
    {id:'weekdays', label:'Dias da semana'},
  ];
  let rows, valueLabel, isMoney, nameFn, subFn, colLabel;
  if(rankTab==='clients-revenue'){ rows=clientRevenue; valueLabel='Total gasto'; isMoney=true; colLabel='Cliente'; nameFn=x=>x.c.name; subFn=x=>`${appointments.filter(a=>a.clientId===x.c.id&&a.status==='concluido').length} sessões concluídas`; }
  else if(rankTab==='clients-freq'){ rows=clientFreq; valueLabel='Sessões'; isMoney=false; colLabel='Cliente'; nameFn=x=>x.c.name; subFn=x=>fmtMoney(transactions.filter(t=>t.type==='receita'&&t.clientId===x.c.id).reduce((s,t)=>s+Number(t.amount||0),0))+' gastos'; }
  else if(rankTab==='services-revenue'){ rows=serviceRevenue; valueLabel='Faturamento'; isMoney=true; colLabel='Serviço'; nameFn=x=>x.s.name; subFn=x=>x.s.category; }
  else if(rankTab==='services-count'){ rows=serviceCount; valueLabel='Sessões realizadas'; isMoney=false; colLabel='Serviço'; nameFn=x=>x.s.name; subFn=x=>x.s.category; }
  else { rows=weekdayRank; valueLabel='Agendamentos'; isMoney=false; colLabel='Dia da semana'; nameFn=x=>x.name; subFn=x=>totalWeekdaySessions? `${Math.round((x.value/totalWeekdaySessions)*100)}% do total de agendamentos` : ''; }

  const maxVal = Math.max(1, ...rows.map(r=>r.value));

  if(actions) actions.innerHTML = `<button class="btn" id="btn-export-rank-pdf">${icon('download')}<span>Exportar PDF</span></button>`;

  root.innerHTML = `
    <div class="card" style="margin-bottom:14px;">
      <div class="card-body tight" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div class="field" style="min-width:150px;margin:0;"><label>De</label><input id="rank-from" type="date" value="${rankFrom}"/></div>
        <div class="field" style="min-width:150px;margin:0;"><label>Até</label><input id="rank-to" type="date" value="${rankTo}"/></div>
        <button class="btn btn-sm" id="rank-clear-period">Limpar período</button>
        <span class="muted" style="font-size:12px;">${escapeHtml(periodLabel)}</span>
      </div>
    </div>
    <div class="tabs" id="rank-tabs">${tabs.map(t=>`<button class="tab ${rankTab===t.id?'active':''}" data-t="${t.id}">${t.label}</button>`).join('')}</div>
    <div class="card" style="margin-top:14px;">
      <div class="card-head"><h3>${tabs.find(t=>t.id===rankTab).label}</h3><span class="muted" style="font-size:12px;">Top ${Math.min(10,rows.length)}</span></div>
      <div class="card-body tight">
        ${rows.length===0 ? `<div class="empty">${icon('ranking')}<p>Ainda não há dados suficientes para este ranking.</p></div>` :
        `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>${colLabel}</th><th>${valueLabel}</th><th style="width:34%;">Comparativo</th></tr></thead>
          <tbody>${rows.slice(0,10).map((r,i)=>`
            <tr>
              <td><span class="rank-badge ${i<3?'top':''}">${i+1}</span></td>
              <td><div class="cell-strong">${escapeHtml(nameFn(r))}</div>${subFn(r)?`<div class="muted" style="font-size:11.5px;">${escapeHtml(subFn(r))}</div>`:''}</td>
              <td class="tnum cell-strong">${isMoney?fmtMoney(r.value):r.value}</td>
              <td><div style="background:var(--surface-2);border-radius:6px;height:8px;overflow:hidden;"><div style="width:${(r.value/maxVal)*100}%;height:100%;background:var(--accent);border-radius:6px;"></div></div></td>
            </tr>`).join('')}</tbody>
        </table></div>`}
      </div>
    </div>
  `;
  root.querySelectorAll('#rank-tabs .tab').forEach(t=>t.addEventListener('click', ()=>{ rankTab=t.dataset.t; renderRanking(root, actions); }));
  root.querySelector('#rank-from').addEventListener('change', e=>{ rankFrom=e.target.value; renderRanking(root, actions); });
  root.querySelector('#rank-to').addEventListener('change', e=>{ rankTo=e.target.value; renderRanking(root, actions); });
  root.querySelector('#rank-clear-period').addEventListener('click', ()=>{ rankFrom=''; rankTo=''; renderRanking(root, actions); });
  const exportBtn = actions && actions.querySelector('#btn-export-rank-pdf');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    exportRankingPdf(tabs.find(t=>t.id===rankTab).label, periodLabel, colLabel, valueLabel, rows.slice(0,10).map(r=>({name:nameFn(r), value:r.value})), isMoney);
  });
}

let waMessage = 'Olá {{nome}}! Aqui é da Elite Lab Recovery 🧡 Passando pra lembrar da sua próxima sessão de recovery. Qualquer dúvida, é só chamar por aqui!';
let waSelected = null; // Set of client ids — initialized on first render
let waSearch = '';
let waTierFilter = 'all';

function waDigits(phone){ return (phone||'').replace(/\D/g,''); }
function waLink(phone, text){
  let digits = waDigits(phone);
  if(!digits) return null;
  if(digits.length<=11) digits = '55'+digits; // assume Brasil quando sem código do país
  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(text);
}
function waRender(name){ return (waMessage||'').split('{{nome}}').join(name || 'Cliente'); }

function renderWhatsapp(root, actions){
  actions.innerHTML='';
  const {clients} = Store.data;
  const withPhone = clients.filter(c=>waDigits(c.phone));
  if(waSelected===null){ waSelected = new Set(withPhone.filter(c=>c.status!=='inativo').map(c=>c.id)); }
  const noPhoneCount = clients.length - withPhone.length;

  const filtered = withPhone.filter(c=>{
    if(waTierFilter!=='all' && (c.tier||'nenhum')!==waTierFilter) return false;
    if(waSearch && !(c.name||'').toLowerCase().includes(waSearch.toLowerCase())) return false;
    return true;
  });

  root.innerHTML = `
    <div class="card" style="margin-bottom:16px;background:var(--surface-2);">
      <div class="card-body" style="display:flex;gap:12px;align-items:flex-start;">
        <div style="flex:none;color:var(--accent);margin-top:1px;">${icon('whatsapp')}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;">
          <strong style="color:var(--ink);">Sobre o envio:</strong> esta página roda dentro do navegador e, por segurança, não pode guardar nem usar diretamente o token da API oficial do WhatsApp Business (Meta) — expor essa credencial numa página compartilhada com a equipe permitiria que qualquer pessoa com o link enviasse mensagens pela conta da clínica. Por isso o envio aqui funciona assim: você escreve a mensagem uma vez, o sistema personaliza com o nome de cada cliente e abre o WhatsApp Web/App já com a conversa e o texto prontos — você só confirma o envio, cliente por cliente. Para automação 100% sem clique via API oficial, é preciso uma integração server-side separada (posso te ajudar a planejar isso depois).
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>Mensagem</h3></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">
          <div class="field">
            <label>Texto da mensagem <span class="hint">use {{nome}} para inserir o nome do cliente</span></label>
            <textarea id="wa-text" style="min-height:110px;">${escapeHtml(waMessage)}</textarea>
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;">Pré-visualização</label>
            <div id="wa-preview" style="background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;">${escapeHtml(waRender(filtered[0]?.name))}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Destinatários</h3><span class="muted" id="wa-count" style="font-size:12px;">${waSelected.size} selecionado(s)</span></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:10px;">
          <div class="filter-bar" style="margin-bottom:0;">
            <div class="search-input" style="max-width:100%;flex:1;">${icon('search')}<input id="wa-search" placeholder="Buscar cliente" value="${escapeHtml(waSearch)}"/></div>
            <select id="wa-tier-filter" style="min-width:130px;">
              <option value="all" ${waTierFilter==='all'?'selected':''}>Todas categorias</option>
              <option value="ouro" ${waTierFilter==='ouro'?'selected':''}>Ouro</option>
              <option value="prata" ${waTierFilter==='prata'?'selected':''}>Prata</option>
              <option value="bronze" ${waTierFilter==='bronze'?'selected':''}>Bronze</option>
              <option value="nenhum" ${waTierFilter==='nenhum'?'selected':''}>Sem categoria</option>
            </select>
          </div>
          <div class="flex gap8">
            <button class="btn btn-sm" id="wa-select-all">Selecionar tudo</button>
            <button class="btn btn-sm" id="wa-select-none">Limpar seleção</button>
          </div>
          ${noPhoneCount>0?`<div class="muted" style="font-size:11.5px;">${noPhoneCount} cliente(s) sem telefone cadastrado não aparecem aqui.</div>`:''}
          <div class="table-wrap" style="max-height:340px;overflow-y:auto;">
            ${filtered.length===0? `<div class="empty">${icon('users')}<p>Nenhum cliente encontrado.</p></div>` :
            `<table>
              <tbody>${filtered.map(c=>{
                const tier=CLIENT_TIERS[c.tier];
                const checked = waSelected.has(c.id);
                return `<tr>
                  <td style="width:30px;"><input type="checkbox" class="wa-check" data-id="${c.id}" ${checked?'checked':''} style="width:auto;"/></td>
                  <td class="flex gap10"><div class="avatar">${initials(c.name)}</div><div><div class="cell-strong">${escapeHtml(c.name)}</div><div class="muted" style="font-size:11px;">${escapeHtml(c.phone)}</div></div></td>
                  <td>${tier?`<span class="badge ${tier.cls}">${tier.label}</span>`:''}</td>
                  <td style="text-align:right;"><a class="btn btn-sm btn-primary" target="_blank" rel="noopener" href="${waLink(c.phone, waRender(c.name))}">${icon('whatsapp')}Enviar</a></td>

              }).join('')}</tbody>
            </table>`}
          </div>
        </div>
      </div>
    </div>
  `;

  const textEl = root.querySelector('#wa-text');
  const previewEl = root.querySelector('#wa-preview');
  textEl.addEventListener('input', ()=>{
    waMessage = textEl.value;
    previewEl.textContent = waRender(filtered[0]?.name);
    // refresh each send link's href with the new text
    root.querySelectorAll('tbody tr').forEach(tr=>{
      const cb = tr.querySelector('.wa-check');
      const a = tr.querySelector('a.btn-primary');
      if(cb && a){ const c = filtered.find(x=>x.id===cb.dataset.id); if(c) a.href = waLink(c.phone, waRender(c.name)); }
    });
  });
  root.querySelector('#wa-search').addEventListener('input', e=>{ waSearch=e.target.value; renderWhatsapp(root,actions); root.querySelector('#wa-search').focus(); });
  root.querySelector('#wa-tier-filter').addEventListener('change', e=>{ waTierFilter=e.target.value; renderWhatsapp(root,actions); });
  root.querySelector('#wa-select-all').addEventListener('click', ()=>{ filtered.forEach(c=>waSelected.add(c.id)); renderWhatsapp(root,actions); });
  root.querySelector('#wa-select-none').addEventListener('click', ()=>{ filtered.forEach(c=>waSelected.delete(c.id)); renderWhatsapp(root,actions); });
  root.querySelectorAll('.wa-check').forEach(cb=>cb.addEventListener('change', ()=>{
    if(cb.checked) waSelected.add(cb.dataset.id); else waSelected.delete(cb.dataset.id);
    root.querySelector('#wa-count').textContent = waSelected.size+' selecionado(s)';
  }));
}

function lsiPercent(d,e){
  if(d===''||e===''||d==null||e==null) return null;
  d=Number(d); e=Number(e);
  if(isNaN(d)||isNaN(e)) return null;
  const lo = Math.min(d,e), hi = Math.max(d,e);
  if(hi<=0) return null;
  return Math.round((lo/hi)*100);
}
function lsiClass(pct){
  if(pct==null) return '';
  if(pct>=90) return 'good';
  if(pct>=80) return 'warn';
  return 'bad';
}

  const side = SIDE_LABELS[m.side] ? ` (${SIDE_LABELS[m.side]})` : '';
  return `${m.bodyPart||'—'}${side} — ${m.parameter||'—'}`;
}

    actions.innerHTML = clients.length>0 ? `<button class="btn btn-primary" id="btn-new-assess-global">${icon('plus')}<span>Nova avaliação</span></button>` : '';
    const list = clients.filter(c=> (c.name||'').toLowerCase().includes(assessSearch.toLowerCase()));
    const byClient = {};
    assessments.forEach(a=>{ (byClient[a.clientId] || (byClient[a.clientId]=[])).push(a); });
    const enriched = list.map(c=>{
      const own = (byClient[c.id]||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      return {c, own};
    });
    const ASSESS_SORT_VALUE = {
      name: e=> e.c.name||'',
      count: e=> e.own.length,
      last: e=> (e.own[0]?e.own[0].date:'')||'',
    };
    enriched.sort((a,b)=> compareBy(assessListSort.dir, ASSESS_SORT_VALUE[assessListSort.key](a), ASSESS_SORT_VALUE[assessListSort.key](b)));
    root.innerHTML = `
      <div class="filter-bar">
        <div class="search-input">${icon('search')}<input id="assess-search" placeholder="Buscar cliente" value="${escapeHtml(assessSearch)}"/></div>
      </div>
      <div class="card">
        <div class="card-body tight">
          ${clients.length===0 ? `<div class="empty">${icon('users')}<p>Cadastre um cliente primeiro para lançar avaliações.</p></div>` :
          enriched.length===0 ? `<div class="empty">${icon('search')}<p>Nenhum cliente encontrado.</p></div>` :
          `<div class="table-wrap"><table>
            <thead><tr>${thSort('Cliente','name',assessListSort)}${thSort('Avaliações registradas','count',assessListSort)}${thSort('Última avaliação','last',assessListSort)}<th></th></tr></thead>
            <tbody>${enriched.map(({c, own})=>{
              return `<tr>
                <td class="flex gap10"><div class="avatar">${initials(c.name)}</div><div class="cell-strong">${escapeHtml(c.name)}</div></td>
                <td class="tnum">${own.length}</td>
                <td class="tnum">${own[0]?fmtDate(own[0].date):'—'}</td>
                <td><div class="row-actions">
                  <button class="btn btn-sm btn-primary" data-new="${c.id}">${icon('plus')}Avaliar</button>
                  <button class="btn btn-sm" data-open="${c.id}">Ver histórico</button>
                </div></td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>`}
        </div>
      </div>
    `;
    const searchEl = root.querySelector('#assess-search');
    if(searchEl) searchEl.addEventListener('input', e=>{
      assessSearch = e.target.value;
      clearTimeout(window.__assessSearchTimer);
      window.__assessSearchTimer = setTimeout(()=>{
        renderAssessments(root,actions);
        const el = root.querySelector('#assess-search');
        if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      }, 150);
    });
    bindSortHeaders(root, assessListSort, ()=>renderAssessments(root,actions));
    root.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>{ assessClientId=b.dataset.open; assessCompareKey=null; renderAssessments(root,actions); }));
    root.querySelectorAll('[data-new]').forEach(b=>b.addEventListener('click', ()=>{
      const c = clients.find(x=>x.id===b.dataset.new);
      if(c) openFichaPicker(c);
    }));
    const btnGlobal = document.getElementById('btn-new-assess-global');
    if(btnGlobal) btnGlobal.addEventListener('click', ()=>openClientPickerForAssessment(root, actions));
    return;
  }

  const client = clients.find(c=>c.id===assessClientId);
  if(!client){ assessClientId=null; renderAssessments(root,actions); return; }
  const own = assessments.filter(a=>a.clientId===assessClientId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  actions.innerHTML = `<button class="btn" id="btn-email-assess" ${own.length===0?'disabled':''}>${icon('mail')}<span>Enviar por e-mail</span></button><button class="btn btn-primary" id="btn-new-assess">${icon('plus')}<span>Nova avaliação</span></button>`;
  actions.querySelector('#btn-new-assess').addEventListener('click', ()=>openFichaPicker(client));
  const emailBtn = actions.querySelector('#btn-email-assess');
  if(emailBtn) emailBtn.addEventListener('click', ()=>openSendAssessmentsEmailModal(client, own));

  const keyCount = {};
  own.forEach(a=>(a.measurements||[]).forEach(m=>{ const k=measureKey(m); keyCount[k]=(keyCount[k]||0)+1; }));
  const keyOptions = Object.keys(keyCount).sort((a,b)=>keyCount[b]-keyCount[a]);
  if(!assessCompareKey || !keyOptions.includes(assessCompareKey)) assessCompareKey = keyOptions[0]||null;

  let chartHtml = `<div class="empty">${icon('ranking')}<p>Registre pelo menos 2 avaliações com o mesmo segmento/parâmetro para ver a evolução em gráfico.</p></div>`;
  if(assessCompareKey){
    const [bp,side,param] = assessCompareKey.split('|');
    const points = own
      .map(a=>{ const m=(a.measurements||[]).find(x=>measureKey(x)===assessCompareKey); return m? {date:a.date, value:Number(m.value), unit:m.unit||''} : null; })
      .filter(Boolean)
      .sort((x,y)=>(x.date||'').localeCompare(y.date||''));
    if(points.length>=2){
      chartHtml = buildLineChartSVG(points);
    } else if(points.length===1){
      chartHtml = `<div class="empty">${icon('ranking')}<p>Só há 1 avaliação registrada para "${escapeHtml(measureLabel({bodyPart:bp,side,parameter:param}))}" até agora. Registre outra para comparar a evolução.</p></div>`;
    }
  }

  root.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="assess-back" style="margin-bottom:14px;">&larr; Voltar para clientes</button>
    <div class="card-head" style="padding:0 0 14px;border:none;">
      <div class="flex gap10"><div class="avatar" style="width:38px;height:38px;font-size:14px;">${initials(client.name)}</div><div><h3 style="margin:0;">${escapeHtml(client.name)}</h3><div class="muted" style="font-size:12px;">${own.length} avaliação(ões) registrada(s)</div></div></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head">
        <h3>Evolução entre avaliações</h3>
        ${keyOptions.length>0? `<select id="assess-compare-select" style="min-width:220px;">${keyOptions.map(k=>{ const [bp,side,param]=k.split('|'); return `<option value="${escapeHtml(k)}" ${k===assessCompareKey?'selected':''}>${escapeHtml(measureLabel({bodyPart:bp,side,parameter:param}))}</option>`; }).join('')}</select>` : ''}
      </div>
      <div class="card-body">${chartHtml}</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Histórico de avaliações</h3></div>
      <div class="card-body tight">
        ${own.length===0? `<div class="empty">${icon('assess')}<p>Nenhuma avaliação registrada ainda para este cliente.</p></div>` :
        `<div class="table-wrap"><table>
          <thead><tr><th>Data</th><th>Ficha</th><th>Medições</th><th>Observações</th><th></th></tr></thead>
          <tbody>${own.map(a=>`
            <tr>
              <td class="tnum cell-strong">${fmtDate(a.date)}</td>
              <td>${fichaBadgeHtml(a)}</td>
              <td>${(a.measurements||[]).map(m=>`<span class="badge muted" style="margin:1px 3px 1px 0;">${escapeHtml(measureLabel(m))}: ${m.value}${escapeHtml(m.unit||'')}</span>`).join('')}</td>
              <td class="muted" style="max-width:220px;">${escapeHtml(a.notes||'—')}</td>
              <td><div class="row-actions">
                <button class="btn btn-ghost icon-btn" data-edit="${a.id}">${icon('edit')}</button>
                <button class="btn btn-ghost icon-btn btn-danger" data-del="${a.id}">${icon('trash')}</button>
              </div></td>
            </tr>`).join('')}</tbody>
        </table></div>`}
      </div>
    </div>
  `;

  root.querySelector('#assess-back').addEventListener('click', ()=>{ assessClientId=null; renderAssessments(root,actions); });
  const compareSel = root.querySelector('#assess-compare-select');
  if(compareSel) compareSel.addEventListener('change', e=>{ assessCompareKey=e.target.value; renderAssessments(root,actions); });
  root.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openAssessmentForm(client, own.find(a=>a.id===b.dataset.edit))));
  root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Remover esta avaliação?')){ Store.remove('assessments', b.dataset.del); showToast('Avaliação removida'); }
  }));
}

function buildAssessmentsMailBody(client, own){
  const ordered = [...own].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const blocks = ordered.map(a=>{
    const fichaLabel = a.fichaType && FICHA_TEMPLATES[a.fichaType] ? FICHA_TEMPLATES[a.fichaType].label : 'Avaliação livre';
    const meds = (a.measurements||[]).map(m=>`  - ${measureLabel(m)}: ${m.value}${m.unit||''}`).join('\n') || '  - (sem medições registradas)';
    const notes = a.notes ? `  Observações: ${a.notes}` : '';
    let extra = '';
    if(a.complaint && a.complaint.locations && a.complaint.locations.length){
      extra += `\n  Queixa principal: ${a.complaint.locations.join(', ')}${a.complaint.side?` (lado ${SIDE_LABELS[a.complaint.side]||a.complaint.side})`:''}`;
    }
    if(a.riskFlags && a.riskFlags.length){
      extra += `\n  Sinais de alerta: ${a.riskFlags.join('; ')}`;
    }
    if(a.semaphore){
      extra += `\n  Classificação de risco: ${a.semaphore.toUpperCase()}`;
    }
    if(a.conduct){
      extra += `\n  Conduta: ${a.conduct}`;
    }
    return `${fmtDate(a.date)} — ${fichaLabel}\n${meds}${extra}${notes?'\n'+notes:''}`;
  });
  return `Histórico de avaliações físicas — ${client.name}\nElite Lab Recovery\n\nTotal de avaliações: ${ordered.length}\n\n${blocks.join('\n\n')}`;
}

  const subjectDefault = `Elite Lab Recovery — Histórico de avaliações de ${client.name}`;
  const bodyDefault = buildAssessmentsMailBody(client, own);
  const autoAvailable = !!(window.EMAILJS_CONFIG && window.EMAILJS_CONFIG.publicKey && window.EMAILJS_CONFIG.serviceId && window.EMAILJS_CONFIG.templateId && window.emailjs);
  openModal(`
    <div class="modal-head"><h3>Enviar avaliações por e-mail</h3><button class="btn btn-ghost icon-btn" data-close-modal>${icon('close')}</button></div>
    <div class="modal-body">
      <p class="muted" style="font-size:12.5px;margin-top:0;">${autoAvailable ? `O e-mail pode ser enviado automaticamente para ${escapeHtml(client.name)}, ou você pode abrir seu programa de e-mail para revisar antes de enviar.` : `Como o app roda direto no navegador, sem servidor próprio, ao clicar em "Abrir e-mail" seu programa de e-mail padrão será aberto já com o destinatário, assunto e o histórico completo de ${escapeHtml(client.name)} preenchidos. Revise e clique em enviar por lá.`}</p>
      <div class="field"><label>E-mail do destinatário</label><input id="f-mail-to" type="email" value="${escapeHtml(client.email||'')}" placeholder="cliente@email.com"/></div>
      <div class="field"><label>Assunto</label><input id="f-mail-subject" value="${escapeHtml(subjectDefault)}"/></div>
      <div class="field"><label>Mensagem</label><textarea id="f-mail-body" style="min-height:220px;">${escapeHtml(bodyDefault)}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close-modal>Cancelar</button>
      ${autoAvailable ? `<button class="btn" id="f-mail-manual">${icon('mail')}Abrir e-mail</button><button class="btn btn-primary" id="f-mail-auto">${icon('check')}Enviar automaticamente</button>` : `<button class="btn btn-primary" id="f-mail-send">${icon('mail')}Abrir e-mail</button>`}
    </div>
  `, m=>{
    const doManual = ()=>{
      const to = m.querySelector('#f-mail-to').value.trim();
      if(!to){ showToast('Informe o e-mail do destinatário'); return; }
      const subject = m.querySelector('#f-mail-subject').value.trim() || subjectDefault;
      const body = m.querySelector('#f-mail-body').value;
      window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      closeModal();
    };
    if(autoAvailable){
      m.querySelector('#f-mail-manual').addEventListener('click', doManual);
      m.querySelector('#f-mail-auto').addEventListener('click', async ()=>{
        const to = m.querySelector('#f-mail-to').value.trim();
        if(!to){ showToast('Informe o e-mail do destinatário'); return; }
        const subject = m.querySelector('#f-mail-subject').value.trim() || subjectDefault;
        const body = m.querySelector('#f-mail-body').value;
        const btn = m.querySelector('#f-mail-auto'); btn.disabled = true; btn.textContent = 'Enviando...';
        try{
          await window.emailjs.send(window.EMAILJS_CONFIG.serviceId, window.EMAILJS_CONFIG.templateId, {
            to_email: to, to_name: client.name, subject, message: body
          }, window.EMAILJS_CONFIG.publicKey);
          showToast('E-mail enviado com sucesso'); closeModal();
        }catch(err){
          console.error(err);
          showToast('Falha ao enviar automaticamente. Tente "Abrir e-mail".');
          btn.disabled = false; btn.textContent = 'Enviar automaticamente';
        }
      });
    } else {
      m.querySelector('#f-mail-send').addEventListener('click', doManual);
    }
  }, {wide:true});
}
function buildLineChartSVG(points){
  const W=640, H=220, padL=44, padR=20, padT=20, padB=34;
  const values = points.map(p=>p.value);
  let minV = Math.min(...values), maxV = Math.max(...values);
  if(minV===maxV){ minV -= 1; maxV += 1; }
  const range = maxV-minV;
  minV -= range*0.12; maxV += range*0.12;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (points.length===1?innerW/2:(i/(points.length-1))*innerW);
  const y = v => padT + innerH - ((v-minV)/(maxV-minV))*innerH;
  const path = points.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const gridLines = [0,0.5,1].map(t=>{
    const yy = padT + innerH*t;
    const val = maxV - (maxV-minV)*t;
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${val.toFixed(1)}</text>`;
  }).join('');
  const dots = points.map((p,i)=>`
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="4" fill="var(--accent)"/>
    <text x="${x(i).toFixed(1)}" y="${(y(p.value)-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${p.value}${escapeHtml(p.unit||'')}</text>
    <text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtDateShort(p.date)}</text>
  `).join('');
  return `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto;display:block;">
    ${gridLines}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg></div>`;
}

function openAssessmentForm(client, existing, fichaTypeParam){
  const fichaType = fichaTypeParam || (existing && existing.fichaType) || 'livre';
  if(fichaType !== 'livre'){ return openFichaAssessmentForm(client, existing, fichaType); }

  const isEdit = !!existing;
  const rows = (existing?.measurements && existing.measurements.length) ? existing.measurements : [{}];
  const rowHtml = m => `<div class="measure-row">
    <div class="field"><label style="font-size:11px;">Segmento</label><input list="dl-bodyparts" class="m-part" value="${escapeHtml(m.bodyPart||'')}" placeholder="Ex: Joelho"/></div>
    <div class="field"><label style="font-size:11px;">Lado</label><select class="m-side">
      <option value="D" ${m.side==='D'?'selected':''}>Direito</option>
      <option value="E" ${m.side==='E'?'selected':''}>Esquerdo</option>
      <option value="B" ${m.side==='B'?'selected':''}>Bilateral</option>
      <option value="NA" ${(!m.side||m.side==='NA')?'selected':''}>N/A</option>
    </select></div>
    <div class="field"><label style="font-size:11px;">Parâmetro</label><input list="dl-params" class="m-param" value="${escapeHtml(m.parameter||'')}" placeholder="Ex: Amplitude (flexão)"/></div>
    <div class="field"><label style="font-size:11px;">Valor</label><input type="number" step="0.1" class="m-value" value="${m.value??''}"/></div>
    <div class="field"><label style="font-size:11px;">Unid.</label><input class="m-unit" value="${escapeHtml(m.unit||'')}" placeholder="°, cm..."/></div>
    <button type="button" class="btn btn-ghost icon-btn btn-danger m-remove">${icon('trash')}</button>
  </div>`;

  openModal(`
    <div class="modal-head"><h3>${isEdit?'Editar avaliação':'Nova avaliação'} — ${escapeHtml(client.name)}</h3><button class="btn btn-ghost icon-btn" data-close-modal>${icon('close')}</button></div>
    <div class="modal-body">
      <datalist id="dl-bodyparts">${BODY_PARTS.map(b=>`<option value="${b}">`).join('')}</datalist>
      <datalist id="dl-params">${ASSESS_PARAMETERS.map(p=>`<option value="${p.name}">`).join('')}</datalist>
      <div class="field"><label>Data da avaliação</label><input id="f-date" type="date" value="${existing?.date||todayISO()}"/></div>
      <div>
        <label style="font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:8px;">Medições — membros e parâmetros avaliados</label>
        <div id="measure-rows">${rows.map(rowHtml).join('')}</div>
        <button type="button" class="btn btn-sm" id="btn-add-row">${icon('plus')}Adicionar medição</button>
      </div>
      <div class="field"><label>Observações</label><textarea id="f-notes" placeholder="Achados clínicos, evolução observada, orientações...">${escapeHtml(existing?.notes||'')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close-modal>Cancelar</button><button class="btn btn-primary" id="f-save">${icon('check')}Salvar</button></div>
  `, root=>{
    const container = root.querySelector('#measure-rows');
    container.addEventListener('click', e=>{
      const btn = e.target.closest('.m-remove');
      if(btn){ const row=btn.closest('.measure-row'); if(container.children.length>1) row.remove(); else { row.querySelectorAll('input').forEach(i=>i.value=''); row.querySelector('.m-side').value='NA'; } }
    });
    root.querySelector('#btn-add-row').addEventListener('click', ()=>{
      container.insertAdjacentHTML('beforeend', rowHtml({}));
    });
    root.querySelector('#f-save').addEventListener('click', async ()=>{
      const date = root.querySelector('#f-date').value || todayISO();
      const notes = root.querySelector('#f-notes').value.trim();
      const measurements = [...container.querySelectorAll('.measure-row')].map(row=>({
        bodyPart: row.querySelector('.m-part').value.trim(),

      if(measurements.length===0){ showToast('Adicione pelo menos uma medição válida (segmento, parâmetro e valor)'); return; }
      const payload = { clientId:client.id, clientName:client.name, date, notes, measurements, fichaType:'livre' };
      if(isEdit) await Store.update('assessments', existing.id, payload); else await Store.add('assessments', payload);
      showToast(isEdit?'Avaliação atualizada':'Avaliação registrada'); closeModal();
    });
  }, {wide:true});
}

function openFichaAssessmentForm(client, existing, fichaType){

  const complaintLocs = complaint.locations || [];

  const locationsHtml = tpl.complaintLocations.map(loc=>`
    <label class="fc-check"><input type="checkbox" class="fc-loc" value="${escapeHtml(loc)}" ${complaintLocs.includes(loc)?'checked':''}/> <span>${escapeHtml(loc)}</span></label>

  openModal(`
    <div class="modal-head"><h3>${isEdit?'Editar':'Nova'} avaliação — ${escapeHtml(tpl.label)} — ${escapeHtml(client.name)}</h3><button class="btn btn-ghost icon-btn" data-close-modal>${icon('close')}</button></div>

      <div class="field"><label>Data da avaliação</label><input id="f-date" type="date" value="${existing?.date||todayISO()}"/></div>

        <div class="field"><label>Lado</label><select id="f-c-side">
          <option value="D" ${complaint.side==='D'?'selected':''}>Direito</option>
          <option value="E" ${complaint.side==='E'?'selected':''}>Esquerdo</option>
          <option value="B" ${complaint.side==='B'?'selected':''}>Bilateral</option>
          <option value="NA" ${(!complaint.side||complaint.side==='NA')?'selected':''}>N/A</option>
        </select></div>
        <div class="field"><label>Início dos sintomas</label><input id="f-c-onset" type="date" value="${complaint.onset||''}"/></div>
        <div class="field"><label>Tempo de evolução</label><input id="f-c-duration" value="${escapeHtml(complaint.duration||'')}" placeholder="Ex: 3 semanas"/></div>
      </div>
      <div class="fc-row-3">
        <div class="field"><label>EVA agora (0-10)</label><input id="f-c-eva-now" type="number" min="0" max="10" value="${complaint.evaNow??''}"/></div>
        <div class="field"><label>EVA pior momento (0-10)</label><input id="f-c-eva-worst" type="number" min="0" max="10" value="${complaint.evaWorst??''}"/></div>
        <div class="field"><label>EVA dia seguinte (0-10)</label><input id="f-c-eva-next" type="number" min="0" max="10" value="${complaint.evaNextDay??''}"/></div>
      </div>

      <div class="fc-section-title">02 · Rastreio de risco</div>
      <div class="fc-check-grid">${flagsHtml}</div>

      <div class="fc-section-title">03 · Testes de força / desempenho (Direito vs Esquerdo)</div>
      <div id="fc-tests">${testsHtml}</div>

      <div class="fc-section-title">04 · Classificação</div>
      <div class="fc-semaphore" id="fc-semaphore">
        <label class="fc-sem-opt fc-sem-verde"><input type="radio" name="fc-sem" value="verde" ${semaphore==='verde'?'checked':''}/> Verde</label>
        <label class="fc-sem-opt fc-sem-amarelo"><input type="radio" name="fc-sem" value="amarelo" ${semaphore==='amarelo'?'checked':''}/> Amarelo</label>
        <label class="fc-sem-opt fc-sem-vermelho"><input type="radio" name="fc-sem" value="vermelho" ${semaphore==='vermelho'?'checked':''}/> Vermelho</label>
      </div>
      <div class="field"><label>Conduta / orientações</label><textarea id="f-conduct" placeholder="Conduta, exercícios prescritos, encaminhamentos...">${escapeHtml(conduct)}</textarea></div>
      <div class="field"><label>Próxima reavaliação</label><input id="f-next-review" type="date" value="${nextReview}"/></div>
      <div class="field"><label>Observações gerais</label><textarea id="f-notes">${escapeHtml(existing?.notes||'')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close-modal>Cancelar</button><button class="btn btn-primary" id="f-save">${icon('check')}Salvar</button></div>
  `, root=>{
    const updateLsi = ()=>{
      root.querySelectorAll('.fc-testrow').forEach(row=>{
        const d = row.querySelector('.fc-t-d').value;
        const e = row.querySelector('.fc-t-e').value;
        const pct = lsiPercent(d,e);
        const el = row.querySelector('[data-lsi]');
        if(pct==null){ el.textContent=''; el.className='fc-lsi'; }
        else { el.textContent = `LSI ${pct}%`; el.className = `fc-lsi fc-lsi-${lsiClass(pct)}`; }
      });
    };
    root.querySelectorAll('.fc-t-d, .fc-t-e').forEach(inp=>inp.addEventListener('input', updateLsi));
    updateLsi();
    root.querySelectorAll('.fc-flagbox').forEach(cb=>cb.addEventListener('change', ()=>{
      const anyChecked = [...root.querySelectorAll('.fc-flagbox')].some(x=>x.checked);
      if(anyChecked){ const r = root.querySelector('input[name="fc-sem"][value="vermelho"]'); if(r) r.checked = true; }
    }));
    root.querySelector('#f-save').addEventListener('click', async ()=>{
      const date = root.querySelector('#f-date').value || todayISO();
      const notes = root.querySelector('#f-notes').value.trim();
      const locations = [...root.querySelectorAll('.fc-loc:checked')].map(i=>i.value);
      const riskFlagsChecked = [...root.querySelectorAll('.fc-flagbox:checked')].map(i=>i.value);
      const semaphoreVal = (root.querySelector('input[name="fc-sem"]:checked')||{}).value || 'verde';
      const conductVal = root.querySelector('#f-conduct').value.trim();
      const nextReviewVal = root.querySelector('#f-next-review').value;
      const complaintObj = {
        locations,
        side: root.querySelector('#f-c-side').value,
        onset: root.querySelector('#f-c-onset').value,
        duration: root.querySelector('#f-c-duration').value.trim(),
        evaNow: root.querySelector('#f-c-eva-now').value===''?null:Number(root.querySelector('#f-c-eva-now').value),
        evaWorst: root.querySelector('#f-c-eva-worst').value===''?null:Number(root.querySelector('#f-c-eva-worst').value),
        evaNextDay: root.querySelector('#f-c-eva-next').value===''?null:Number(root.querySelector('#f-c-eva-next').value),
      };
      const testResultsObj = {};
      const measurements = [];
      root.querySelectorAll('.fc-testrow').forEach(row=>{
        const name = row.dataset.test;
        const t = tpl.tests.find(x=>x.name===name);
        const dVal = row.querySelector('.fc-t-d').value;
        const eVal = row.querySelector('.fc-t-e').value;
        if(dVal!=='' || eVal!==''){
          testResultsObj[name] = { d: dVal===''?null:Number(dVal), e: eVal===''?null:Number(eVal) };
          if(dVal!=='') measurements.push({bodyPart:name, side:'D', parameter:'Resultado', value:Number(dVal), unit:t?t.unit:''});
          if(eVal!=='') measurements.push({bodyPart:name, side:'E', parameter:'Resultado', value:Number(eVal), unit:t?t.unit:''});
        }
      });
      if(locations.length===0 && measurements.length===0){
        showToast('Preencha ao menos a queixa principal ou um teste');
        return;
      }
      const payload = {
        clientId: client.id, clientName: client.name, date, notes, measurements,
        fichaType, complaint: complaintObj, riskFlags: riskFlagsChecked,
        semaphore: semaphoreVal, conduct: conductVal, nextReview: nextReviewVal,
      };
      if(isEdit) await Store.update('assessments', existing.id, payload); else await Store.add('assessments', payload);
      showToast(isEdit?'Avaliação atualizada':'Avaliação registrada'); closeModal();
    });
  }, {wide:true});
}

/* ---------- MOBILE MENU ---------- */
document.getElementById('menu-toggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('sidebar-backdrop').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
});

/* ---------- ACCESS PIN ---------- */
let serviceCasingMigrationDone = false;
async function ensureServicesUppercase(){
  if(serviceCasingMigrationDone) return;
  const {services} = Store.data;
  if(!services || !services.length) return;
  const needsFix = services.filter(s=> (s.name && s.name!==s.name.toUpperCase()) || (s.category && s.category!==s.category.toUpperCase()));
  serviceCasingMigrationDone = true;
  for(const s of needsFix){
    try{ await Store.update('services', s.id, { name:(s.name||'').toUpperCase(), category:(s.category||'').toUpperCase() }); }
    catch(e){ console.warn('Falha ao padronizar maiúsculas do serviço', s.id, e); }
  }
}

function bootApp(){
  renderNav();
  Store.onChange(()=>{ renderView(); ensureServicesUppercase(); });
  Store.init();
  renderView();
  ensureServicesUppercase();
  GCal.init();
  setInterval(()=>{ if(GCal.isConnected() && GCal.hasValidToken()) GCal.pullSync(); }, GCAL_PULL_INTERVAL_MS);
}

const gate = document.getElementById('pin-gate');
const needsPin = typeof CLINIC_ACCESS_CODE!=='undefined' && CLINIC_ACCESS_CODE && CLINIC_ACCESS_CODE.length>0;
const alreadyUnlocked = needsPin && sessionStorage.getItem('recoveryhub_unlocked')==='1';
if(needsPin && !alreadyUnlocked){
  gate.hidden=false;
  const input=document.getElementById('pin-input');
  const err=document.getElementById('pin-error');
  const tryUnlock=()=>{
    if(input.value===CLINIC_ACCESS_CODE){
      sessionStorage.setItem('recoveryhub_unlocked','1');
      gate.hidden=true;
      bootApp();
    } else {
      err.textContent='Código incorreto, tente novamente.';
      input.value=''; input.focus();
    }
  };
  document.getElementById('pin-submit').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  input.focus();
} else {
  bootApp();
}

/* ---------- BOOT ---------- */

})();
</script>
